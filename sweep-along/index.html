<script>
/* ============================================================
   沿わせ配置（sweep-along）— 000_README.md 仕様。
   ガイドのパスに沿って、間隔の規則（アンカー・一定・曲率・奥行き）でオブジェクトを
   複製し、奥行きを付けて回転投影すると密度が生まれる。幾何演算は sweep.js。
   ここはDOM／取り込み／描画／書き出しだけを持つ。
   ============================================================ */
var SVGNS = 'http://www.w3.org/2000/svg';
var TOOL = 'sweep-along';
var PJ = '160_沿わせ配置';
var LAW = 'ガイドのパスに沿って間隔の規則でオブジェクトを複製し、奥行きを付けて回転投影すると密度が生まれる';
var TOOL_VERSION = '0.7.0';
var PARAMS_VERSION = 6; // 段6ブラッシュアップ: 色の変化(colorKind/color2)・貼った要素を順に使う・交互に裏返す・変化の幅の単位(%)を追加
var FILL_COLOR = '#2b2b2b';
var GUIDE_DEFAULT_SVG = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><path fill=\"none\" stroke=\"#04c\" stroke-width=\".9\" d=\"M200,100C200,155.23,155.23,200,100,200C44.77,200,0,155.23,0,100C0,44.77,44.77,0,100,0C155.23,0,200,44.77,200,100Z\"/></svg>";  // INIT-01: 最初のガイドは円1つ

var canvas = document.getElementById('canvas');
var errBar = document.getElementById('errBar');

/* --- 状態 ------------------------------------------------------------- */
var state = {
  guideText: '',
  guideSub: null,
  guideFlat: null,
  objText: '' // 貼り付け済みの並べるもののSVG文字列（''なら内蔵の形を使う）
};
/* 並べるもののSVGは「貼ったものの大きさ」(objSize)を変えるたびに読み直す必要があるため、
   常駐パースはせず objParsedNow() で都度（テキスト・大きさが変わった時だけ）計算する。 */
var objParsedCache = { text: null, size: null, result: null };
function objParsedNow() {
  if (!state.objText) return null;
  if (objParsedCache.text === state.objText && objParsedCache.size === values.objSize) return objParsedCache.result;
  var result = Sweep.parseObjectSVG(state.objText, { size: values.objSize });
  objParsedCache = { text: state.objText, size: values.objSize, result: result };
  return result;
}
function clearObjParsedCache() { objParsedCache = { text: null, size: null, result: null }; }

function setError(msg) { errBar.textContent = msg; }
function clearError() { errBar.textContent = ''; }

/* 貼られたSVG文字列から <path d="..."> を全部拾う（DOMParserを使わない・軽い正規表現）。
   <path>で囲まず d の値だけが貼られた場合（Mから始まる）もそのまま1本として読む。 */
function extractPathDs(text) {
  var ds = [];
  var re = /<path\b[^>]*\sd\s*=\s*("([^"]*)"|'([^']*)')/gi;
  var m;
  while ((m = re.exec(text))) {
    var d = m[2] != null ? m[2] : m[3];
    if (d) ds.push(d);
  }
  if (!ds.length) {
    var trimmed = String(text || '').trim();
    if (/^[Mm]/.test(trimmed)) ds.push(trimmed);
  }
  return ds;
}

function subsFromText(text) {
  /* ガイドも rect/circle/ellipse/line/polyline/polygon/path を全部読む（指揮者修正 2026-09-25:
     <polygon> のガイドが読めなかった）。<svg>無しの d 文字列は従来どおり extractPathDs で拾う */
  var parsed = Sweep.parseObjectSVG(text, { raw: true });
  if (parsed && parsed.subs && parsed.subs.length) return parsed.subs;
  var ds = extractPathDs(text);
  var subs = [];
  ds.forEach(function (d) { subs = subs.concat(Sweep.parsePath(d)); });
  return subs;
}

/* --- ガイドの取り込み ---------------------------------------------------- */
function loadGuide(text) {
  var subs = subsFromText(text);
  if (!subs.length) { setError('ガイドのパスが見つかりません'); Studio.toast('ガイドのパスが見つかりません', { kind: 'error', sticky: true }); return false; }
  var sub = null;
  for (var i = 0; i < subs.length; i++) { if (subs[i].closed) { sub = subs[i]; break; } }
  if (!sub) sub = subs[0];
  if (!sub.segs.length) { setError('有効なパスがありません'); Studio.toast('有効なパスがありません', { kind: 'error', sticky: true }); return false; }
  state.guideText = text;
  state.guideSub = sub;
  state.guideFlat = Sweep.flatten(sub, 0.5);
  clearError();
  return true;
}

/* --- 並べるものの取り込み（段2: rect/circle/ellipse/line/polyline/polygon/path を
   全部読む。transformも焼く。読めた要素の大きさを「貼ったものの大きさ」へ正規化する） ---- */
function loadObject(text) {
  var parsed = Sweep.parseObjectSVG(text, { size: values.objSize });
  if (!parsed) {
    // 互換: <svg>タグなしで d文字列だけが貼られた場合（段1からの書式）もpathとして読む
    var trimmed = String(text || '').trim();
    if (/^[Mm]/.test(trimmed)) {
      var bareSubs = Sweep.parsePath(trimmed);
      if (bareSubs.length && bareSubs.some(function (s) { return s.segs.length; })) {
        state.objText = '<path d="' + trimmed.replace(/"/g, '&quot;') + '"/>';
        clearObjParsedCache();
        clearError();
        return true;
      }
    }
    setError('読める要素がありません');
    Studio.toast('読める要素がありません', { kind: 'error', sticky: true });
    return false;
  }
  state.objText = text;
  clearObjParsedCache();
  /* 2026-10-14 ユーザー「沿っているものの線幅の調整」: 貼ったものの線幅をパネル「線の太さ」へ取り込み、以後はパネルで調整する */
  for (var pi = 0; pi < parsed.paths.length; pi++) {
    var pp = parsed.paths[pi];
    if (pp.stroke && pp.stroke !== 'none' && pp.strokeWidth) { values.set('strokeWidth', Math.max(0.1, Math.round(pp.strokeWidth * 10) / 10)); break; }
  }
  clearError();
  return true;
}
function clearObjectOverride() {
  state.objText = '';
  clearObjParsedCache();
}

/* --- 並べるものの形（内蔵 or 貼り付け・幾何のみ） --------------------------- */
function computeObjPaths() {
  var parsed = objParsedNow();
  if (parsed && parsed.paths.length) {
    var subs = [];
    parsed.paths.forEach(function (p) { subs = subs.concat(Sweep.parsePath(p.d)); });
    return subs;
  }
  if (values.objKind === 'segment') return Sweep.builtinShape('segment', { length: values.segmentLength });
  if (values.objKind === 'arrow') return Sweep.builtinShape('arrow', { length: values.segmentLength });
  return Sweep.builtinShape('circle', { diameter: values.circleDiameter });
}

/* --- 並べるものの色（段2「見た目」群）。
   貼ったものの色を使う=ON かつ貼り付けがある時は、貼った要素の中から最初に見つかった
   実際の塗り色・線色を使う（複数要素を1個=1<path>へ統合するため、代表色1つに決める）。
   OFF、または内蔵の形（円・線分・矢印）の時は「見た目」群の色をそのまま使う。 -------- */
function computeObjStyle() {
  var parsed = objParsedNow();
  if (parsed && values.useObjectColor) {
    var fill, stroke, strokeWidth;
    for (var i = 0; i < parsed.paths.length; i++) {
      if (parsed.paths[i].fill && parsed.paths[i].fill !== 'none') { fill = parsed.paths[i].fill; break; }
    }
    for (var j = 0; j < parsed.paths.length; j++) {
      if (parsed.paths[j].stroke && parsed.paths[j].stroke !== 'none') { stroke = parsed.paths[j].stroke; strokeWidth = parsed.paths[j].strokeWidth || 1; break; }
    }
    if (!fill && !stroke) fill = FILL_COLOR;
    return { fill: fill || 'none', stroke: stroke, strokeWidth: values.strokeWidth };   // 2026-10-14 線の太さはパネルの値（貼った時に取り込む）
  }
  var fillC = colorState.fillColor && colorState.fillColor !== 'none' ? colorState.fillColor : 'none';
  var strokeC = colorState.strokeColor && colorState.strokeColor !== 'none' ? colorState.strokeColor : undefined;
  /* 線分・矢印は開いたパスなので塗りでは見えない。線の色が「なし」なら塗りの色を線に使う
     （指揮者修正 2026-09-25: 線の色の既定が「なし」のため線分が消えていた） */
  if (!parsed && (values.objKind === 'segment' || values.objKind === 'arrow') && !strokeC) {
    strokeC = fillC !== 'none' ? fillC : FILL_COLOR;
    fillC = 'none';
  }
  return { fill: fillC, stroke: strokeC, strokeWidth: values.strokeWidth };
}

/* --- 貼った要素を順に使う（段6-B-9）。並べるものが貼り付け・複数要素の時だけ、
   parseObjectSVGが返す要素ごとのpaths（各自の色を保つ）を返す。1要素以下、または
   貼り付けが無い/機能OFFならnull（=呼び出し側は今までどおり統合したobjPaths/styleを使う）。 */
function objElementsList() {
  if (!values.useElementsInOrder || !state.objText) return null;
  var parsed = objParsedNow();
  if (!parsed || !parsed.paths || parsed.paths.length < 2) return null;
  return parsed.paths;
}
function styleForElement(elem) {
  var fill = (elem.fill && elem.fill !== 'none') ? elem.fill : 'none';
  var stroke = elem.stroke && elem.stroke !== 'none' ? elem.stroke : undefined;
  if (fill === 'none' && !stroke) fill = FILL_COLOR;
  return { fill: fill, stroke: stroke, strokeWidth: values.strokeWidth };
}

/* --- 色の変化（段6-B-8・見た目群）。placementsの並び順（seqIndex）に対応する色配列を
   返す。colorKind='none'、または「貼った要素を順に使う」が効いている間（各要素が
   自分の色を保つ方を優先）はnull（呼び出し側は元のstyleをそのまま使う）。 --------- */
function computePlacementColors(placements, style) {
  if (!values.colorKind || values.colorKind === 'none') return null;
  if (objElementsList()) return null;
  var base = (style.fill && style.fill !== 'none') ? style.fill : (style.stroke && style.stroke !== 'none' ? style.stroke : FILL_COLOR);
  return Sweep.colorRule(placements, values.colorKind, base, values.color2, { flat: state.guideFlat, gain: 1 });
}
/* colorsArr[p.seqIndex] を、塗り・線のどちらが「見えている色」かに応じて差し替える
   （両方見えている時は塗りの方を差し替える・簡略化。000_README.mdに明記）。 */
function resolvePlacementStyle(p, style, colorsArr) {
  if (!colorsArr) return style;
  var c = colorsArr[p.seqIndex != null ? p.seqIndex : 0];
  if (style.fill && style.fill !== 'none') return { fill: c, stroke: style.stroke, strokeWidth: style.strokeWidth };
  if (style.stroke && style.stroke !== 'none') return { fill: style.fill, stroke: c, strokeWidth: style.strokeWidth };
  return { fill: c, stroke: style.stroke, strokeWidth: style.strokeWidth };
}

/* --- 奥行きの規則パラメータをdepthProfileのoptsへ変換 ------------------------ */
function depthOptsFor(v) {
  if (v.depthKind === 'wave') return { cycles: v.depthCycles, phase: (v.depthPhase || 0) + playWaveOff, amp: v.depthAmp };
  if (v.depthKind === 'ramp') return { from: -v.depthAmp, to: v.depthAmp };
  if (v.depthKind === 'alt') return { amp: v.depthAmp };
  return {};
}

/* --- 沿わせ方の自由度（段2）の設定値をapplySweepOptionsのoptsへ変換 ------------- */
function sweepOptsFor(v) {
  return {
    startShift: v.startShift, rangeStart: v.rangeStart, rangeEnd: v.rangeEnd,
    offset: v.offset, offsetWaveAmp: v.offsetWaveAmp, offsetWaveCycles: v.offsetWaveCycles,
    tilt: v.tilt, spinTurns: v.spinTurns,
    columns: v.columns, columnGap: v.columnGap,
    jitter: { seed: v.jitterSeed, pos: v.jitterPos, size: v.jitterSize, angle: v.jitterAngle }
  };
}

/* --- 立体（段5・5-2）: 「置く面」を Sweep.placeOnFrame/bakeObject3D の plane 名へ、
   「透視の強さ」をカメラ距離fへ変換する（カメラ距離=viewBox長辺×(10/透視の強さ)・
   spec.md 5-2）。 ----------------------------------------------------------- */
function solidPlaneFor(v) { return v.solidMode === 'stand' ? 'stand' : (v.solidMode === 'twist' ? 'twist' : 'lay'); }
function solidProjOpts(vb) {
  var persp = values.perspective || 0;
  var f = persp > 0 ? Math.max(vb.w, vb.h) * (10 / persp) : 1000;
  return { ax: axNow(), ay: ayNow(), persp: persp, f: f };
}

/* 各配置に奥行きz（奥行きの規則から。置き方が「奥行きで密に」以外でも効く）を割り当てる。
   sizeRule('depth')が反応できるよう、applySweepOptionsの前後どちらでも呼べる純粋な関数
   にしてある（弧長sから3D曲線上のzを引くだけ・向きは変えない）。 */
function assignDepthZ(placements, flat, flat3D) {
  if (!flat.length) { placements.forEach(function (p) { p.z = 0; }); return; }
  placements.forEach(function (p) {
    var s2d = ((p.s % flat.length) + flat.length) % flat.length;
    var s3 = Sweep.arcLength2Dto3D(flat, flat3D, s2d);
    p.z = Sweep.frameAt(flat3D, s3, null).P.z;
  });
}

/* 最終（使う範囲・ずらし・列・ばらつき適用後）の配置に、向き(frame.N/B)・ひねり角・
   投影後の奥行き(sortZ・回転ax/ayを反映)・正規化した奥行き(depthNorm・0=奥,1=手前)を
   付ける。原点(frame.P.x/y)は配置の実座標(離す距離・列・ばらつき込み)を使い、
   向きだけ3D曲線のその弧長位置のフレームを使う（frameAtの位置そのものではなく）。 */
function attachSolidFrames(placements, flat, flat3D) {
  var L = flat3D.length;
  var prevN = null;
  placements.forEach(function (p) {
    var s2d = flat.length > 1e-9 ? ((p.s % flat.length) + flat.length) % flat.length : 0;
    var s3 = Sweep.arcLength2Dto3D(flat, flat3D, s2d);
    var fr0 = Sweep.frameAt(flat3D, s3, prevN);
    prevN = fr0.N;
    p.frame = { P: { x: p.x, y: p.y, z: fr0.P.z }, T: fr0.T, N: fr0.N, B: fr0.B };
    p.z = fr0.P.z;
    p.twistRad = L > 1e-9 ? 2 * Math.PI * (values.twistTurns || 0) * (s3 / L) : 0;
  });
  var zs = placements.map(function (p) { return p.z || 0; });
  var zMin = zs.length ? Math.min.apply(null, zs) : 0, zMax = zs.length ? Math.max.apply(null, zs) : 0;
  var zSpan = (zMax - zMin) || 1;
  placements.forEach(function (p) {
    p.depthNorm = (( p.z || 0) - zMin) / zSpan;
    var rotP = Sweep.rotateProject([[p.x, p.y, p.z || 0]], axNow(), ayNow())[0];
    p.sortZ = rotP.z;
  });
}

/* --- 配置の計算（置き方→向き(固定角)→[立体: 奥行きz]→大きさ→沿わせ方の自由度→
   [立体: 向き(frame)・ひねり・投影奥行き]） -----------------------------------
   applySweepOptionsを大きさの後に置く理由: 使う範囲・列数・ばらつきは「向き・大きさが
   決まった後の並び全体」に対する調整（範囲の絞り込み・列の複製・位置と大きさの
   ばらつき）として効かせたいため。傾き・進行で回すは各配置の角度に加算するだけ
   なので、固定角(orientMode='fixed')の後でも意味が保たれる。奥行きzは、大きさの変化
   「奥行きで」が使う範囲/ずらしの前後どちらでも同じ弧長基準で反応できるよう、
   sizeRuleの前後2回（使う範囲の前後）で付け直す。 --------------------------------- */
function computePlacements() {
  var flat = state.guideFlat;
  if (!flat) return [];
  var mode = values.placeMode;
  var opts = {};
  if (mode === 'count') opts = { count: values.count };
  else if (mode === 'distance') opts = { distance: values.distance };
  else if (mode === 'curvature') opts = { count: values.count, k: values.curvatureK };
  else if (mode === 'depth') opts = { count: values.count, depthKind: values.depthKind, depthOpts: depthOptsFor(values), ax: axNow(), ay: ayNow() };
  var placements = Sweep.place(flat, mode, opts);

  if (values.orientMode === 'fixed') {
    var rad = values.fixedAngle * Math.PI / 180;
    placements.forEach(function (p) { p.angle = rad; });
  }
  if (playSpinRad) placements.forEach(function (p) { p.angle += playSpinRad; });   // 再生中の向きの回転

  var flat3D = null;
  if (values.useDepth) {
    flat3D = Sweep.build3DFlat(flat, values.depthKind, depthOptsFor(values));
    assignDepthZ(placements, flat, flat3D);
  }

  /* 段6-B-7: 変化の幅は−100〜+100%のUI値を/100してsizeRuleのgain（-1〜1想定）へ渡す。
     全モード共通のスケール（sweep.js taperEnds/taperCenterのコメント参照）。 */
  Sweep.sizeRule(placements, values.sizeMode, { gain: (values.sizeGain || 0) / 100, flat: flat });
  var out = Sweep.applySweepOptions(placements, flat, sweepOptsFor(values));

  if (values.useDepth) {

  }
  /* seqIndex: ガイドに沿った並び順（0始まり）。z並び替え（立体の描画順）や列複製の後でも
     「貼った要素を順に使う」「交互に裏返す」「色の変化」が並び順基準で効くよう、
     最終配列のインデックスをここで一度だけ固定して各placementへ持たせる。 */

/* --- 表示範囲（ガイドの実測bboxに、並べるものの寸法ぶん余白を足す） -------------- */
function bboxOf2DPoints(pts) {
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  pts.forEach(function (p) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;

  var objSize = Math.max(values.circleDiameter || 0, values.segmentLength || 0, values.objSize || 0);

/* 版面フィット（段7バグ修正・000_README.mdの規則）: 版面(artboard)は常にkitの大きさ
   （上部バー「大きさ」・sizeWH）そのもの＝内容によって伸び縮みしない固定の枠。
   対象（立体OFF＝ガイド＋配置の2Dbbox、立体ON＝投影後の配置＋投影後のガイドのbbox）を
   Sweep.fitToArtboard で版面へ中央揃え・余白8%収める一様変換{scale,tx,ty}を1か所
   （このcomputeArtFit）だけで計算し、描画（render）・書き出し（buildExportSVG）・
   シーンJSON（buildSceneJSON）の全部がここを通す。
   オブジェクトの大きさ（円の直径px等）は版面のpxとして扱うため、フィットの拡大は
   ガイド・配置の「位置」にだけ掛かるようにする：fitArtグループへ transform として
   scale/tx/tyを掛け、その分だけ「並べるものの局所形状」を1/scaleへ事前縮小して
   打ち消す（scaleSubs）。旧「投影後のbbox＋余白8%」（段6-A-5・段6-A-5-2）はこの規則
   へ置き換えた。 */

    var flat3D = Sweep.build3DFlat(flat, values.depthKind, depthOptsFor(values));
    pts2D = flat3D.pts.map(function (p) { return Sweep.projectPoint(p, proj); });
    placements.forEach(function (p) { pts2D.push(Sweep.projectPoint({ x: p.x, y: p.y, z: p.z || 0 }, proj)); });
  } else {
    pts2D = flat.pts.map(function (p) { return { x: p.x, y: p.y }; });
    placements.forEach(function (p) { pts2D.push({ x: p.x, y: p.y }); });

  var bb = bboxOf2DPoints(pts2D);

/* オブジェクトの局所形状（1個ぶんのsubs配列）をk倍する。版面フィットの拡大は
   fitArtグループの transform で位置ごと掛かるため、局所形状だけあらかじめ1/scale
   しておくと最終的な見た目の大きさが変わらない（版面フィットの規則・上のコメント）。 */

/* --- 配置を<path>群としてcontainerへ描く（画面描画・SVG書き出しの共通処理）。
   立体OFFなら今までどおりbakeObject。立体ONならbakeObject3D＋shadeColor（陰影）で
   1個ずつ3D→2Dへ焼く（段5・DoD(段5g): OFFのときはこの分岐に入らないので既存結果と一致）。
   shapeScale（既定1）: 版面フィットの拡大を打ち消すため、並べるものの局所形状だけ
   あらかじめこの倍率で縮めてから焼く（呼び出し側がcomputeArtFit().scaleの逆数を渡す）。 */
function drawArtInto(container, placements, objPaths, style, vb, shapeScale) {
  shapeScale = shapeScale != null ? shapeScale : 1;
  var solidOn = !!values.useDepth;
  var plane = solidPlaneFor(values);
  var proj = solidOn ? solidProjOpts(vb) : null;
  var elements = objElementsList();
  var colorsArr = elements ? null : computePlacementColors(placements, style);
  var baseObjPaths = scaleSubs(objPaths, shapeScale);
  var ordered = placements.slice().sort(function (a, b) {
    return (solidOn ? (a.sortZ || 0) : (a.z || 0)) - (solidOn ? (b.sortZ || 0) : (b.z || 0));

    if (solidOn) {

      var facing = 1;
      if ((plane === 'stand' || plane === 'twist') && p.frame) {
        var Trot = Sweep.rotateProject([[p.frame.T.x, p.frame.T.y, p.frame.T.z]], axNow(), ayNow())[0];
        facing = Math.abs(Trot.z);
      }
      var shadeOpts = { depthNorm: p.depthNorm, haze: values.haze, facing: facing, brightness: values.brightness, bg: '#ffffff' };
      if (fillC && fillC !== 'none') fillC = Sweep.shadeColor(fillC, shadeOpts);
      if (strokeC && strokeC !== 'none') strokeC = Sweep.shadeColor(strokeC, shadeOpts);
      if (values.thinFar) swC = swC * (0.5 + 0.5 * (p.depthNorm != null ? p.depthNorm : 1));
    } else {

    if (strokeC && strokeC !== 'none') { path.setAttribute('stroke', strokeC); path.setAttribute('stroke-width', swC); }
    container.appendChild(path);
  });
}

/* --- 版面（§0・§13 VID-01）。上部バーの「大きさ」（4:5 既定・1080×1350等）そのもの
   が版面＝内容によって伸び縮みしない固定の枠（版面フィットの規則・computeArtFit参照）。 ---- */
var sizeWH = Studio.SIZES[Object.keys(Studio.SIZES)[0]].slice();
var sizeKeyCur = Object.keys(Studio.SIZES)[0];
var frameBox = null;
function computeFrameBox() {
  return { x: 0, y: 0, w: sizeWH[0], h: sizeWH[1], pxW: sizeWH[0], pxH: sizeWH[1], key: sizeKeyCur };
}
function drawFrameGuide() {
  if (!frameBox) return;
  var f = frameBox, g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'frame-guide'); g.setAttribute('pointer-events', 'none');
  var r = document.createElementNS(SVGNS, 'rect');
  r.setAttribute('x', f.x); r.setAttribute('y', f.y); r.setAttribute('width', f.w); r.setAttribute('height', f.h);
  r.setAttribute('fill', 'none'); r.setAttribute('stroke', '#8A8A8A'); r.setAttribute('stroke-width', 1);
  r.setAttribute('stroke-dasharray', '4 3'); r.setAttribute('vector-effect', 'non-scaling-stroke');
  g.appendChild(r);
  // 横幅の寸法線（版面の上）: 端の目盛り＋「4:5 · 1080 × 1350 px」
  var y = f.y - Math.max(f.w, f.h) * 0.03, tick = Math.max(f.w, f.h) * 0.012;
  function line(x1, y1, x2, y2) {
    var l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', '#8A8A8A'); l.setAttribute('stroke-width', 1); l.setAttribute('vector-effect', 'non-scaling-stroke');
    g.appendChild(l);
  }
  line(f.x, y, f.x + f.w, y); line(f.x, y - tick, f.x, y + tick); line(f.x + f.w, y - tick, f.x + f.w, y + tick);

  t.setAttribute('x', f.x + f.w / 2); t.setAttribute('y', y - tick * 1.3); t.setAttribute('text-anchor', 'middle');
  t.setAttribute('font-size', Math.max(f.w, f.h) * 0.022); t.setAttribute('fill', '#6F6F6F');
  t.setAttribute('font-family', 'ui-monospace, Menlo, monospace'); t.setAttribute('font-weight', '600');
  t.textContent = f.key + ' · ' + f.pxW + ' × ' + f.pxH + ' px';

/* --- 色（§0・§5 COLOR-00）。上部バーのスウォッチへ（塗り・線・背景）。パネルには
   色の群を置かない。規定パレット（Studio.PALETTES）から初期値を選ぶ（暗い方を塗りに、
   線は既定「なし」・背景は既定「白」）。 ------------------------------------------- */
var DEFAULT_PALETTE_COLORS = (Studio.PALETTES && Studio.PALETTES[0] && Studio.PALETTES[0].colors) || [FILL_COLOR, '#ffffff'];
function pickDefaultFillColor() {

function setColorState(key, v) { colorState[key] = v; render(); pushHistory(); }

/* --- 描画パイプライン ------------------------------------------------------- */
function render() {
  syncVisibility();
  updatePasteSummaries();

  if (!state.guideFlat) { frameBox = null; return; }
  // 版面はkitの大きさそのもの（固定）。中身（ガイド＋配置。立体ONは投影後）は
  // computeArtFitで版面へ中央揃え・余白8%のfitArtグループtransformとして収める
  // （版面フィットの規則・computeArtFitのコメント参照）。

  frameBox = computeFrameBox();
  var fit = computeArtFit(state.guideFlat);
  var m = Math.max(frameBox.w, frameBox.h) * 0.06;
  canvas.setAttribute('viewBox', [frameBox.x - m, frameBox.y - m, frameBox.w + 2 * m, frameBox.h + 2 * m].join(' '));

  if (colorState.bg && colorState.bg !== 'none') {   // 背景は版面の中だけに塗る（外は作業台の色）

    fbg.setAttribute('width', frameBox.w); fbg.setAttribute('height', frameBox.h);
    fbg.setAttribute('fill', colorState.bg); fbg.setAttribute('pointer-events', 'none');

  var fitArt = document.createElementNS(SVGNS, 'g'); fitArt.setAttribute('class', 'fit-art');
  fitArt.setAttribute('transform', 'matrix(' + fit.scale + ' 0 0 ' + fit.scale + ' ' + fit.tx + ' ' + fit.ty + ')');
  canvas.appendChild(fitArt);

  if (values.showGuide) {
    var solidGuideOn = !!values.useDepth;
    var guideD, anchorPts2D;
    if (solidGuideOn) {
      /* ガイドも配置と同じ回転・投影で描く（破線・アンカーとも）。
         3D曲線(flat3D)を弧長順に投影して折れ線として描く（元のベジェ制御点は使わず、
         flatten済みの点列を使う簡略化。dash表示なので実用上は視覚差が出ない）。
         版面フィットはfitArtグループのtransformで掛かるため、ここではraw座標のまま描く。 */

          var z = Sweep.frameAt(guideFlat3D, s3, null).P.z;

    pGuide.setAttribute('d', guideD);
    fitArt.appendChild(pGuide);
    /* ガイドのアンカーを表示（段4）: 画面表示だけ。書き出しSVG・シーンJSONには入れない
       （buildExportSVG/buildSceneJSONはこのcanvas描画と別に配置だけから組み立てるため、
       ここに足すだけで自動的に書き出しからは除外される）。 */

}

/* --- 全部振る（段6-A-6・上部バー）＋振り直す（ばらつき群・種だけ変える） ------------
   置き方・向き・大きさの変化・パスからの距離・ばらつき・色 の値を新しい種で乱数に
   入れ替える。⌘Z（pushHistory）で1回で戻せる。角度パラメータ(固定角・傾き)はvalues.set

    values.set(key, Math.max(item.min, Math.min(item.max, v)));

    values.set(key, rng.pick(opts).value);

function shuffleAll() {
  var rng = Studio.rng(Math.floor(Math.random() * 0xffffffff) + 1);
  ['placeMode', 'count', 'distance', 'curvatureK', 'startShift'].forEach(function (k) { shuffleValueFor(rng, k); });
  var rs = Math.round(rng.range(0, 60)), re = Math.round(rng.range(rs + 15, 100));
  values.set('rangeStart', rs); values.set('rangeEnd', re);
  shuffleValueFor(rng, 'orientMode');
  if (angleRows.fixedAngle) { angleRows.fixedAngle.setValue(rng.range(0, 360)); values.fixedAngle = angleRows.fixedAngle.getValue(); }
  if (angleRows.tilt) { angleRows.tilt.setValue(rng.range(0, 360)); values.tilt = angleRows.tilt.getValue(); }
  ['spinTurns', 'mirrorAlternate', 'sizeMode', 'sizeGain',
    'offset', 'offsetWaveAmp', 'offsetWaveCycles', 'columns', 'columnGap',
    'jitterPos', 'jitterSize', 'jitterAngle', 'jitterSeed',

shuffleAllBtn.textContent = '全部振る';
shuffleAllBtn.title = '種を変えて置き方・向き・大きさの変化・パスからの距離・ばらつき・色をまとめて変える（⌘Zで戻る）';

/* --- 既定の再生（段6-A-4）: kitのtogglePlayはA/B未記録だとopts.playへ委譲する
   （呼ぶたびに開始/停止をトグル）。「開始位置のずらし」を0→100%でループさせる

/* --- 並べるものの形select: 貼り付け中は「貼ったもの」と表示してselectを無効化

   値はDOM操作だけで変えない（貼り付けを外したら元の選択へ戻る）。 --------------- */
function updateObjKindUI() {

  if (state.objText) {

   設定は表示しない（原則。5-1冒頭）。 ------------------------------------------ */

  if (!selectEl) return null;
  for (var i = 0; i < selectEl.options.length; i++) if (selectEl.options[i].value === val) return selectEl.options[i];
  return null;
}

}
function syncVisibility() {

  setRowVisible(rowForKey.circleDiameter, !objText && v.objKind === 'circle');
  setRowVisible(rowForKey.segmentLength, !objText && (v.objKind === 'segment' || v.objKind === 'arrow'));
  setRowVisible(rowForKey.objSize, objText);
  setRowVisible(rowForKey.useElementsInOrder, objText);

  setRowVisible(rowForKey.count, v.placeMode === 'count' || v.placeMode === 'curvature' || v.placeMode === 'depth');
  setRowVisible(rowForKey.distance, v.placeMode === 'distance');
  setRowVisible(rowForKey.curvatureK, v.placeMode === 'curvature');

  setRowVisible(fixedAngleRow.el, v.orientMode === 'fixed');
  setRowVisible(tiltRow.el, v.orientMode === 'tangent');

  setRowVisible(rowForKey.sizeGain, v.sizeMode !== 'constant');

  setRowVisible(rowForKey.offsetWaveCycles, (v.offsetWaveAmp || 0) > 0);

  setRowVisible(rowForKey.strokeWidth, (!!colorState.strokeColor && colorState.strokeColor !== 'none') || (!objText && (v.objKind === 'segment' || v.objKind === 'arrow')) || (pastedHasStroke && v.useObjectColor));
  setRowVisible(rowForKey.color2, v.colorKind !== 'none');

/* --- ⌘Z／⇧⌘Z（006_ツールの規格 §7・KEY-00・段5でStudio.keysへ置き換え）--------
   スナップショット = {values: panelの全values（角度5キー含む）, guideSvg, objSvg}。

/* --- 各欄へのドロップ（段6-A-1「欄にドロップ＝その欄の対象にする」）。封筒の有無は

/* --- 書き出し（006_ツールの規格 §1〜§4） --------------------------------- */

/* includeBg（既定true）: §13 VID-01「書き出しは背景込み」・§8 COPY-01「⌘C/コピーは

function buildExportSVG(includeBg) {

  var vb = compute2DViewBox(state.guideFlat); // 透視のカメラ距離fの基準（版面とは独立）
  var fb = computeFrameBox();
  var fit = computeArtFit(state.guideFlat);

  svg.setAttribute('width', fb.w); svg.setAttribute('height', fb.h);

/* --- 上部バー共通操作（Studio.stageBar・§13 VID-02/03）用の橋渡し ------------------
   getParams/apply: パネルの数値・角度行の値（values）＋色（colorState）のスナップショット。
   frame: 1コマ分のSVG文字列。A/Bが記録されていればparamsを一時的に当ててbuildExportSVG(true)
   を呼び、終わったら元に戻す。A/B無し（params:null）は今の状態をそのまま1コマとして返す
   （このツールは立体スプラインのような「自前の回転再生」を持たないため）。 --------------- */
function motionParams() {
  var p = {};
  Object.keys(values).forEach(function (k) { p[k] = values[k]; });
  p.fillColor = colorState.fillColor; p.strokeColor = colorState.strokeColor; p.bg = colorState.bg;

}
function applyParamsToState(p) {
  Object.keys(p).forEach(function (k) {
    if (k === 'fillColor' || k === 'strokeColor' || k === 'bg') { colorState[k] = p[k]; }
    else if (ANGLE_KEYS.indexOf(k) >= 0) { if (angleRows[k]) { angleRows[k].setValue(p[k]); values[k] = angleRows[k].getValue(); } }
    else if (Object.prototype.hasOwnProperty.call(values, k)) { values.set(k, p[k]); }
  });

/* A/B 無しの映像書き出し（2026-10-13 ユーザー「カクツクのがひどい」）: 以前は「今の画面」をそのまま1コマにしていたため、
   再生中の rAF が壁時計で進めた値を符号化の遅い間隔で拾い、コマごとの進み幅がばらついていた。
   159・157 と同じく、コマの時刻 t から決定的に作る。1周＝書き出しの秒数（ループ映像が継ぎ目なく繋がる）。 */
function frameFromOwnMotion(t, dur) {
  var period = values.playPeriod || DEFAULT_PLAY_PERIOD;   // 画面の再生と同じ速さ（2026-10-14 流れる速さをパネルへ）
  var u = ((t / period) % 1 + 1) % 1; if (values.playReverse) u = 1 - u;

  var svg = buildExportSVG(true);
  var text = Studio.serializeSVG(svg, { standard: true });
  document.body.removeChild(svg);
  values.startShift = beforeShift; playSpinRad = beforeSpin; playRotAx = beforeAx; playRotAy = beforeAy; playWaveOff = beforeWave;
  return text;
}
function frameForExport(ctx) {
  if (!state.guideFlat) throw new Error('先にガイドを読み込んでください');
  if (!ctx.params) return frameFromOwnMotion(ctx.t, ctx.dur);
  var before = motionParams();
  applyParamsToState(ctx.params); // render()は呼ばない（書き出し中に画面を毎コマ更新しない）

/* --- 動きと空間への展開への出口（141_動きと空間への展開/scene-json.md「scene/1」契約）------
   配置1個=1 path（実際の塗り色）をshapes・unitsの両方へ。unitsは輪郭を直線分割した
   頂点列＋step（並び順）＋z（奥行き・任意項目）。器（150_動きの書き出し）はunitsを図形ごとに
   動かし・浮かせる。rule には全設定を保存するだけ（読むアダプターは深さ3で作る）。 --- */
function objColorFor(style) {
  if (style.fill && style.fill !== 'none') return style.fill;
  if (style.stroke && style.stroke !== 'none') return style.stroke;
  return FILL_COLOR;
}
function buildSceneJSON() {
  if (!state.guideFlat) return null;
  var vb = compute2DViewBox(state.guideFlat); // 透視のカメラ距離fの基準（版面とは独立）
  var fit = computeArtFit(state.guideFlat);
  var shapeScale = fit.scale > 1e-9 ? 1 / fit.scale : 1;
  var placements = computePlacements();
  var objPaths = scaleSubs(computeObjPaths(), shapeScale);
  var style = computeObjStyle();
  var color = objColorFor(style);
  var solidOn = !!values.useDepth;

  var elements = objElementsList();
  var colorsArr = elements ? null : computePlacementColors(placements, style);
  var ordered = placements.slice().sort(function (a, b) {
    return (solidOn ? (a.sortZ || 0) : (a.z || 0)) - (solidOn ? (b.sortZ || 0) : (b.z || 0));
  });
  var shapes = [], units = [];
  ordered.forEach(function (p, idx) {
    var id = 'placement-' + idx;
    var thisObjPaths = objPaths, baseColor = color;
    if (elements) {
      var elem = elements[Sweep.objectIndexFor(p.seqIndex || 0, elements.length)];
      thisObjPaths = scaleSubs(Sweep.parsePath(elem.d), shapeScale);
      baseColor = objColorFor(styleForElement(elem));
    } else if (colorsArr) {
      baseColor = colorsArr[p.seqIndex != null ? p.seqIndex : idx];
    }
    var thisColor = baseColor, d, pts;
    if (solidOn) {
      thisColor = Sweep.shadeColor(baseColor, { depthNorm: p.depthNorm, haze: values.haze, facing: 1, brightness: values.brightness, bg: '#ffffff' });
      d = Sweep.bakeObject3D(thisObjPaths, p, { plane: plane, twist: p.twistRad, proj: proj });
      pts = Sweep.bakeFlatten3D(thisObjPaths, p, { plane: plane, twist: p.twistRad, proj: proj }, 1);
    } else {

    /* 版面フィット（位置）をここで掛ける（局所形状は上のshapeScaleで打ち消し済みなので
       正味の大きさは変わらない・版面フィットの規則）。dはSweep.parsePath→bakeObjectの
       単純な2Dアフィン再適用（fmt()が生成する'M/L/C'＋数値だけの形式に対して厳密）。 */
    d = Sweep.bakeObject(Sweep.parsePath(d), { x: fit.tx, y: fit.ty, angle: 0, scale: fit.scale });
    pts = pts.map(function (pt) { return [pt[0] * fit.scale + fit.tx, pt[1] * fit.scale + fit.ty]; });

  });

    box: [fit.artboard.x, fit.artboard.y, fit.artboard.w, fit.artboard.h],
    style: { bg: (colorState.bg && colorState.bg !== 'none') ? colorState.bg : 'none' }, // 段6: 背景色を器へ通す
    shapes: shapes, units: units,

    rule: exportMeta().params,
    meta: exportMeta()

}
function doExportSceneJSON() {
  var scene = buildSceneJSON();
  if (!scene) { Studio.toast('先にガイドを読み込んでください', { kind: 'error', sticky: true }); return; }
  var name = fileBase();
  Studio.sceneExport(scene, { name: name + '_scene' });
  Studio.toast(name + '_scene.json を書き出しました（動きの書き出しで開けます）');
}

/* --- 封筒からの復元（006_ツールの規格 §1 RESTORE-01） ------------------------ */
/* 角度パラメータ(位相・固定角・傾き・縦に回す・横に回す)はkit外のAngleDial行なので
   values.set()（kitのsetters経由）ではなく angleRows[key].setValue() で静かに合わせる。
   ANGLE_KEYSは⌘Z履歴（applyHistoryState）と共有（上の「⌘Z／⇧⌘Z」節で宣言済み）。 */

  if (p.guideSvg) guidePasteEl.value = p.guideSvg;

  colorState.strokeColor = p.strokeColor !== undefined ? p.strokeColor : colorState.strokeColor;
  colorState.bg = p.bg !== undefined ? p.bg : '#FFFFFF';
  sb.colors.set('fillColor', colorState.fillColor); sb.colors.set('strokeColor', colorState.strokeColor); sb.colors.set('bg', colorState.bg);
  var keys = ['objKind', 'circleDiameter', 'segmentLength', 'objSize',
    'useObjectColor', 'strokeWidth', 'colorKind', 'color2', 'useElementsInOrder',
    'useDepth', 'placeMode', 'count', 'distance', 'curvatureK',
    'depthKind', 'depthCycles', 'depthAmp', 'orientMode', 'mirrorAlternate',
    'sizeMode', 'sizeGain',
    'startShift', 'rangeStart', 'rangeEnd', 'offset', 'offsetWaveAmp', 'offsetWaveCycles',
    'spinTurns', 'playSpin', 'playRotX', 'playRotY', 'playPeriod', 'playReverse', 'playWave', 'columns', 'columnGap', 'jitterSeed', 'jitterPos', 'jitterSize', 'jitterAngle',
    'showGuide', 'showAnchors',
    'solidMode', 'twistTurns', 'perspective', 'haze', 'brightness', 'thinFar'];
  keys.forEach(function (k) { if (p[k] !== undefined) values.set(k, p[k]); });
  ANGLE_KEYS.forEach(function (k) { if (p[k] !== undefined && angleRows[k]) { angleRows[k].setValue(p[k]); values[k] = angleRows[k].getValue(); } });
  setPasteCollapsed(guideFieldsEl, guideSummaryRowEl, true);
  setPasteCollapsed(objFieldsEl, objSummaryRowEl, true);
  syncVisibility();
}
Studio.onDropSVG(canvas, function (env, file, result) {
  if (!env) {
    /* 段6-A-1: 封筒の無いSVG（＝出自メタデータが無いだけの、正当なSVG）はガイドにする。
       too-large/invalid/unavailable/io-errorは今までどおりエラー表示（読めなかった/壊れている）。 */
    if (result && result.status === 'missing') {
      var rGuide = new FileReader();
      rGuide.onload = function () {
        if (loadGuide(rGuide.result)) {
          guidePasteEl.value = rGuide.result;
          render(); pushHistory(true);
          setPasteCollapsed(guideFieldsEl, guideSummaryRowEl, true);
          Studio.toast('ガイドにしました');
        }
      };
      rGuide.onerror = function () { Studio.toast('ファイルを読み込めませんでした', { kind: 'error', sticky: true }); };
      rGuide.readAsText(file);
      return;
    }
    Studio.toast((result && result.message) || 'SVGを読めませんでした', { kind: 'error', sticky: true }); return;
  }
  if (env.tool !== TOOL) { Studio.toast('別ツールのSVGです（' + env.tool + '）', { kind: 'error', sticky: true }); return; }
  var params = env.params || {};
  var v = env.paramsVersion != null ? env.paramsVersion : PARAMS_VERSION;
  if (v < 2) params = Sweep.migrateParamsV1toV2(params);
  if (v < 3) params = Sweep.migrateParamsV2toV3(params);
  if (v < 4) params = Sweep.migrateParamsV3toV4(params);
  if (v < 5) params = Sweep.migrateParamsV4toV5(params);
  if (v < 6) params = Sweep.migrateParamsV5toV6(params);
  restoringHistory = true;
  restoreFromParams(params);
  restoringHistory = false;
  if (env.memo) bar.setMemo(env.memo);
  render();
  pushHistory(true);
  Studio.toast('設定を復元しました');
});

/* --- 初期状態: 立体は既定OFF（一定・個数60個・大きさ一定）。説明を読まなくても
   ガイドに沿って円が並ぶのが見える。立体は「立体にする」をONにすると使える --- */
loadGuide(GUIDE_DEFAULT_SVG);
render();
pushHistory(true); // 最初の状態も1つ積む（⌘Zで最初へ戻れる）
</script>

<script>
/* studio-apps: オフライン用の登録。https か localhost の時だけ動く */
(function(){
  if(!('serviceWorker' in navigator)) return;
  if(!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })
    .then(function(){
      console.info('studio-apps: オフライン準備完了');
      if(navigator.storage && navigator.storage.persist){
        navigator.storage.persist().then(function(ok){ console.info('studio-apps: 永続化 ' + (ok ? '許可' : '未許可')); });
      }
    })
    .catch(function(err){ console.info('studio-apps: オフライン準備に失敗', err); });
})();
