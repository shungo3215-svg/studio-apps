function cloneAnchor(a, swapHandles){
  return {
    x:a.x, y:a.y, mode:a.mode, brk:a.brk,
    hi: (swapHandles ? a.ho : a.hi) ? {x:(swapHandles?a.ho:a.hi).x, y:(swapHandles?a.ho:a.hi).y} : null,
    ho: (swapHandles ? a.hi : a.ho) ? {x:(swapHandles?a.hi:a.ho).x, y:(swapHandles?a.hi:a.ho).y} : null
  };
}
document.getElementById('bBetween').onclick = ()=>{

  const [pa, pb] = ps;
  const A = S.paths[pa], B = S.paths[pb];
  snap_();
  const anchors = A.anchors.map(a=>cloneAnchor(a,false))
    .concat(B.anchors.slice().reverse().map(a=>cloneAnchor(a,true)));
  const np = {closed:true, fill:true, anchors};
  S.paths.push(np);
  S.cur = S.paths.length-1;
  S.sel = anchors.map((_,i)=>({p:S.cur, a:i}));
  genLast.idxs = [];
  build(); render(); syncInsp();
};

/* ---- カット：選んだアンカーでパスを切る ---- */
function cutTarget(){
  const one = oneSel(); if(!one) return null;
  const P = S.paths[one.p]; if(!P) return null;
  const n = P.anchors.length;
  if(P.closed) return n>=3 ? one : null;
  return (one.a>0 && one.a<n-1) ? one : null;
}
function syncCutBtn(){
  document.getElementById('bCut').disabled = !cutTarget();
}
function cutPath(){
  const t = cutTarget(); if(!t) return;
  const P = S.paths[t.p];
  snap_();
  if(P.closed){
    const n = P.anchors.length;
    const rotated = P.anchors.slice(t.a).concat(P.anchors.slice(0,t.a));
    const head = rotated[0];
    /* 先頭側は ho だけ、末尾側は hi だけを持つ（逆側は null） */
    rotated[0] = {x:head.x, y:head.y, mode:head.mode, brk:head.brk, hi:null,
                  ho: head.ho ? {x:head.ho.x, y:head.ho.y} : null};
    rotated.push({x:head.x, y:head.y, mode:head.mode, brk:head.brk,
                  hi: head.hi ? {x:head.hi.x, y:head.hi.y} : null, ho:null});
    P.anchors = rotated;
    P.closed = false;
    S.cur = t.p;
    S.sel = [{p:t.p, a:0}, {p:t.p, a:rotated.length-1}];
  } else {
    const orig = P.anchors, i = t.a, pt = orig[i];
    const tail = {x:pt.x, y:pt.y, mode:pt.mode, brk:pt.brk,
                  hi: pt.hi ? {x:pt.hi.x, y:pt.hi.y} : null, ho:null};   /* P1側: hiのみ */
    const head = {x:pt.x, y:pt.y, mode:pt.mode, brk:pt.brk, hi:null,
                  ho: pt.ho ? {x:pt.ho.x, y:pt.ho.y} : null};           /* P2側: hoのみ */
    const P1 = {closed:false, fill:P.fill, anchors: orig.slice(0,i).concat([tail])};
    const P2 = {closed:false, fill:P.fill, anchors: [head].concat(orig.slice(i+1))};
    S.paths.splice(t.p, 1, P1, P2);
    S.cur = t.p;
    S.sel = [{p:t.p, a:P1.anchors.length-1}, {p:t.p+1, a:0}];
  }
  genLast.idxs = [];
  build(); render(); syncInsp();
  toast('カットしました');
}
document.getElementById('bCut').onclick = cutPath;

/* ---- 連結：端点どうしを繋ぐ ---- */
function joinTargets(){
  if(S.sel.length!==2) return null;
  const out = [];
  for(const s of S.sel){
    const P = S.paths[s.p]; if(!P || P.closed) return null;
    const n = P.anchors.length; if(n<2) return null;
    if(s.a!==0 && s.a!==n-1) return null;
    out.push(s);
  }
  return out;
}
/* 端点2つでの連結に当てはまらない選択のとき：S.sel に最初に現れた順でパスを並べ、
   開いたパス（アンカー2個以上）が2本以上あれば鎖状に連結する候補として返す。
   閉じたパスが混ざっていたら対象から外す（skippedClosed で知らせる） */
function joinChainTargets(){
  const order = [];
  for(const s of S.sel){ if(order.indexOf(s.p)<0) order.push(s.p); }
  const opens = order.filter(p=>S.paths[p] && !S.paths[p].closed && S.paths[p].anchors.length>=2);
  const skippedClosed = order.some(p=>S.paths[p] && S.paths[p].closed);
  return opens.length>=2 ? {order:opens, skippedClosed} : null;
}
function syncJoinBtn(){
  document.getElementById('bJoin').disabled = !joinTargets() && !joinChainTargets();
}
/* 選択順に鎖状連結。毎回「鎖の自由端（いまの末尾）」と「次のパスの近い方の端点」を繋ぐ。
   端点が一致（±0.01）すれば1点に畳む（mode は片方が bezier なら bezier、hi はA側・ho はB側。
   既存の端点2つの連結と同じ規則）。一致しなければそのまま繋げる（つながった直線が1本増える） */
function joinChain(ct){
  const order = ct.order;
  snap_();
  const baseObj = S.paths[order[0]];
  let chain = baseObj.anchors.slice();
  const joints = [];
  for(let k=1;k<order.length;k++){
    let B = S.paths[order[k]].anchors.slice();
    const tail = chain[chain.length-1];
    const dHead = Math.hypot(B[0].x-tail.x, B[0].y-tail.y);
    const dTail = Math.hypot(B[B.length-1].x-tail.x, B[B.length-1].y-tail.y);
    if(dTail < dHead) B = B.slice().reverse().map(a=>cloneAnchor(a,true));
    const bHead = B[0];
    const close = Math.hypot(tail.x-bHead.x, tail.y-bHead.y) <= 0.01;
    if(close){
      const merged = {
        x:tail.x, y:tail.y,
        mode:(tail.mode==='bezier'||bHead.mode==='bezier') ? 'bezier' : 'spline',
        hi: tail.hi ? {x:tail.hi.x, y:tail.hi.y} : null,     /* hiは鎖側 */
        ho: bHead.ho ? {x:bHead.ho.x, y:bHead.ho.y} : null,  /* hoは次のパス側 */
        brk: !!(tail.brk||bHead.brk)
      };
      joints.push(chain.length-1);
      chain = chain.slice(0,-1).concat([merged], B.slice(1));
    } else {
      joints.push(chain.length-1, chain.length);
      chain = chain.concat(B);
    }
  }
  baseObj.anchors = chain;
  baseObj.closed = false;
  order.slice(1).sort((a,b)=>b-a).forEach(idx=>S.paths.splice(idx,1));
  const newIdx = S.paths.indexOf(baseObj);
  S.cur = newIdx;
  S.sel = joints.map(a=>({p:newIdx, a}));
  genLast.idxs = [];
  build(); render(); syncInsp();
  toast((ct.skippedClosed ? '閉じたパスを除いて' : '') + order.length + '本のパスを連結しました');
}
function joinSelected(){
  const eps = joinTargets();
  if(eps){
    const [e1,e2] = eps;
    snap_();
    if(e1.p===e2.p){
      S.paths[e1.p].closed = true;
      S.cur = e1.p;
      S.sel = [{p:e1.p, a:0}];
    } else {
      const A = S.paths[e1.p], B = S.paths[e2.p];
      const reverseP = P => { P.anchors = P.anchors.slice().reverse().map(a=>cloneAnchor(a,true)); };
      if(e1.a===0) reverseP(A);                          /* Aは選んだ端点が末尾になるよう向きを揃える */
      if(e2.a===B.anchors.length-1) reverseP(B);          /* Bは選んだ端点が先頭になるよう向きを揃える */
      const aLen = A.anchors.length;
      const aLast = A.anchors[aLen-1], bFirst = B.anchors[0];
      const close = Math.hypot(aLast.x-bFirst.x, aLast.y-bFirst.y) <= 0.01;
      let jointIdx;
      if(close){
        const merged = {
          x:aLast.x, y:aLast.y,
          mode:(aLast.mode==='bezier'||bFirst.mode==='bezier') ? 'bezier' : 'spline',
          hi: aLast.hi ? {x:aLast.hi.x, y:aLast.hi.y} : null,   /* hiはA側 */
          ho: bFirst.ho ? {x:bFirst.ho.x, y:bFirst.ho.y} : null, /* hoはB側 */
          brk: !!(aLast.brk||bFirst.brk)
        };
        A.anchors = A.anchors.slice(0,-1).concat([merged], B.anchors.slice(1));
        jointIdx = aLen-1;
      } else {
        A.anchors = A.anchors.concat(B.anchors);
        jointIdx = null;
      }
      S.paths.splice(S.paths.indexOf(B), 1);
      const newAi = S.paths.indexOf(A);
      S.cur = newAi;
      S.sel = jointIdx!==null ? [{p:newAi, a:jointIdx}]
                               : [{p:newAi, a:aLen-1}, {p:newAi, a:aLen}];
    }
    genLast.idxs = [];
    build(); render(); syncInsp();
    toast('連結しました');
    return;
  }
  const ct = joinChainTargets();
  if(ct) joinChain(ct);
}
document.getElementById('bJoin').onclick = joinSelected;

/* =========================================================
   数値の操作（イラレ準拠。006_ツールの規格 §5・135の bindNumberRow が正典）
   ↑↓=±1×step ／ ⇧↑↓=10×stepの倍数へ乗せて±10×step ／
   ラベル左右ドラッグ=連続変更(⇧で1/10) ／ ラベルのダブルクリック=既定値 ／
   直接入力はEnterとblurで確定 ／ フォーカスで全選択 ／
   吸着はドラッグ中のみ、矢印キーと直接入力は吸着を通さない。
   135からの唯一の変更: rng が null のときはスライダー関連の配線を飛ばす
   （座標のように上限が決まらない値のため）。それ以外は1行も変えない。
   ========================================================= */
/* 単位を切り替えられる行（it.u==='px'）の再表示用。切り替えた瞬間に全部 show し直す */
const UNIT_ROWS = [];
function bindNumberRow(it, rng, num, lab, onCommit) {
  const qC = it.step, qF = Math.max(.01, it.step / 10);
  /* px の欄は S.unit==='mm' のとき mm で表示・入力する（k=表示値/内部値）。内部値は px のまま */
  const sw = it.u === 'px';
  const unitEl = sw ? num.parentNode.querySelector('.unit') : null;
  const mmOn = () => sw && S.unit === 'mm';
  const k = () => mmOn() ? 1 / Grid.MM_PX : 1;
  const baseU = () => mmOn() ? (it.step >= 1 ? 1 : .1) : it.step;   /* 1step（表示単位） */
  let cur = it.def;                                  /* 直近の内部値（px） */
  const show = v => {
    cur = v;
    if (rng) rng.value = v;
    num.value = String(+(v * k()).toFixed(2));
    if (unitEl) unitEl.textContent = S.unit;
  };
  /* v は内部値（px）。fine=true のとき mm 表示は 0.01mm に丸める */
  const commit = (v, fine) => {
    v = clamp(v, it.min, it.max);
    if (!fine && it.stops && it.stops.length)
      for (const st of it.stops) if (Math.abs(v - st) <= it.tol) { v = st; break; }
    if (fine && mmOn()) v = +(Math.round(v * k() * 100) / 100 / k()).toFixed(2);
    else { const q = fine ? qF : qC; v = +(Math.round(v / q) * q).toFixed(2); }
    v = clamp(v, it.min, it.max);
    show(v); onCommit(v);
  };
  /* 表示値（mm または px）→ 内部値（px） */
  const toPx = d => d / k();
  /* ⇧+矢印は「10の倍数へ乗せてから ±10step」（イラレの粗い刻みと同じ挙動） */
  const arrow = (dir, shift) => {
    const base = baseU(), big = base * 10;           /* ⇧ で 10step */
    const cur = +num.value;
    const d = shift ? (Math.round(cur / big) * big) + dir * big : cur + dir * base;
    commit(toPx(d), true);
  };
  const keyArrow = e => {
    const d = { ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1 }[e.key];
    if (d === undefined) return false;
    e.preventDefault(); arrow(d, e.shiftKey); return true;
  };
  if (rng) {
    rng.addEventListener("input", e => commit(+rng.value, e.shiftKey));
    rng.addEventListener("keydown", keyArrow);
  }
  /* 直接入力は Enter と blur の両方で明示的に確定する（change イベント頼みだと
     「同じ文字列に戻して Enter」等で発火せず、作品へ反映されないことがある） */
  const commitField = () => { const v = parseFloat(num.value); commit(isNaN(v) ? it.def : toPx(v), true); };
  num.addEventListener("keydown", e => { if (!keyArrow(e) && e.key === "Enter") { commitField(); num.blur(); } });
  num.addEventListener("blur", commitField);
  /* フォーカスで全選択（イラレ準拠: クリックしてそのまま打てば置き換わる）。
     クリック直後の mouseup がこの選択を潰すので、直後1回だけ既定動作を止める */
  num.addEventListener("focus", () => { num.select(); num.dataset.selAt = String(performance.now()); });
  num.addEventListener("mouseup", e => {
    const t0 = +num.dataset.selAt || 0;
    if (t0 && performance.now() - t0 < 400) { e.preventDefault(); num.dataset.selAt = "0"; }
  });
  lab.addEventListener("dblclick", () => commit(it.def, true));
  lab.addEventListener("pointerdown", e => {
    if (e.detail > 1) return;
    lab.setPointerCapture(e.pointerId);
    const x0 = e.clientX, v0 = +num.value;
    const move = ev => commit(toPx(v0 + (ev.clientX - x0) * baseU() * (ev.shiftKey ? .1 : 1)), ev.shiftKey);
    const up = () => { lab.removeEventListener("pointermove", move); lab.removeEventListener("pointerup", up); };
    lab.addEventListener("pointermove", move);
    lab.addEventListener("pointerup", up);
  });
  show(it.def);
  const api = { show, commit };
  if (sw) UNIT_ROWS.push(() => show(cur));
  return api;
}
/* Shift 中はスライダーを 1/10 刻みに（135と同じ。ネイティブのつまみドラッグでも
   細かい値まで拾えるようにする。矢印キー・ラベルドラッグは bindNumberRow 側で対応済み） */
addEventListener("keydown", e => { if (e.key === "Shift") setSliderStep(true); });
addEventListener("keyup",   e => { if (e.key === "Shift") setSliderStep(false); });
function setSliderStep(fine){
  for (const [id, spec] of RANGE_FIELDS) {
    const el = document.getElementById(id);
    if (el) el.step = fine ? spec.step / 10 : spec.step;
  }
}

/* stops（吸着の基準値）の並びを作る（006_ツールの規格 §5 の every ヘルパ） */
const every = (step, min, max) => {
  const out = [];
  for (let v = Math.ceil(min/step)*step; v <= max + 1e-9; v += step) out.push(R2(v));
  return out;
};
/* 角度は「30と45の倍数」に吸着する（006_ツールの規格 §5 の全体標準） */
function angleStops(min, max){
  const s = new Set();
  for (let v = Math.ceil(min/30)*30; v <= max + 1e-9; v += 30) s.add(R2(v));
  for (let v = Math.ceil(min/45)*45; v <= max + 1e-9; v += 45) s.add(R2(v));
  return [...s].sort((a,b)=>a-b);
}

const F_RATIO  = {k:'nRatio',   l:'比率',   u:'×',  min:1.05,  max:2.5, step:0.01, def:1.62, stops:[1.5,1.62,2], tol:0.03};
const F_DIV    = {k:'nDiv',     l:'分割',   u:'本', min:3,     max:48,  step:1,    def:12,   stops:[6,8,12,24], tol:0};

const F_CY     = {k:'nCy',      l:'中心Y',  u:'px', min:-5000, max:5000,step:1,    def:0,    stops:[0], tol:4};

const F_PENCIL = {k:'fPencilTol',l:'許容誤差',u:'px',min:0.5,  max:20,  step:0.5,  def:5,    stops:[2.5,5,10], tol:0.4};
const F_ROT    = {k:'fRotAngle',l:'角度',   u:'°',  min:-360,  max:360, step:1,    def:0,    stops:angleStops(-360,360), tol:3};
const F_X      = {k:'fX',       l:'X',      u:'px', min:-100000,max:100000,step:1, def:0,    stops:[], tol:0};
const F_Y      = {k:'fY',       l:'Y',      u:'px', min:-100000,max:100000,step:1, def:0,    stops:[], tol:0};

const F_GEN_R2 = {k:'nGenR2',   l:'内半径', u:'px', min:5,     max:600, step:1,    def:80,   stops:every(50,5,600), tol:4};
const F_GEN_K  = {k:'nGenK',    l:'跳び',   u:'',   min:2,     max:20,  step:1,    def:2,    stops:[], tol:0};

/* ---- 道具の設定（回転）：field で入力すると、その場で回してから 0 に戻る。
   1回のドラッグ／連続キー押しは「元の位置からの絶対角度」を保つよう、
   ジェスチャの最初だけ座標のスナップショットを取る（キャンバス側の回転ツールと同じ考え方） ---- */
(function(){
  const num = document.getElementById('n-fRotAngle');
  const lab = document.querySelector('label[for="n-fRotAngle"]');
  let from = null;
  const api = bindNumberRow(F_ROT, null, num, lab, v => {
    if(v === 0) return;
    if(!from){
      const ts = rotTargets();
      if(!ts.length){ toast('回転する点がありません'); return; }
      snap_();
      from = ts.map(s=>{
        const a = anchorAt(s);
        return a && {p:s.p, a:s.a, x:a.x, y:a.y,
                     hi: a.hi ? {x:a.hi.x, y:a.hi.y} : null,
                     ho: a.ho ? {x:a.ho.x, y:a.ho.y} : null};
      }).filter(Boolean);
      if(!from.length){ from = null; return; }
    }
    applyRotationFrom(from, {x:S.rot.cx, y:S.rot.cy}, v);
    build(); render();
  });
  const finish = () => { if(from){ from = null; api.show(0); syncInsp(); } };
  lab.addEventListener('pointerup', finish);
  lab.addEventListener('pointercancel', finish);
  num.addEventListener('blur', finish);
  num.addEventListener('keydown', e => { if(e.key==='Enter') finish(); });
  num.addEventListener('keyup', e => {
    if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight') finish();
  });
  rotAngleAPI = api;
  document.getElementById('rotCenterSel').onclick = ()=>{
    const ts = rotTargets(), pts = ts.map(anchorAt).filter(Boolean);
    if(!pts.length){ toast('先に点を選ぶか、何か描いてください'); return; }
    const c = Grid.centroid(pts);
    S.rot.cx = R2(c.x); S.rot.cy = R2(c.y); S.rot.sig = JSON.stringify(ts);
    render();
  };
})();

/* ---- 選択中の点（X・Y）：ドラッグ・連続キー押しは1回のジェスチャにつき
   undo チェックポイントを1つだけ作る（snap_() の多発を避ける） ---- */
function gestureField(spec, rngEl, numEl, labEl, applyFn){
  let started = false;
  const api = bindNumberRow(spec, rngEl, numEl, labEl, v => {
    if(!started){ started = true; snap_(); }
    applyFn(v);
  });
  const finish = () => { started = false; };
  labEl.addEventListener('pointerup', finish);
  labEl.addEventListener('pointercancel', finish);
  numEl.addEventListener('blur', finish);
  numEl.addEventListener('keydown', e => { if(e.key==='Enter') finish(); });
  numEl.addEventListener('keyup', e => {
    if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight') finish();
  });
  return api;
}
const apiX = gestureField(F_X, null, document.getElementById('n-fX'), document.querySelector('label[for="n-fX"]'),
  v => {
    const one = oneSel(); if(!one) return;
    const a = anchorAt(one); if(!a) return;
    const d = R2(v) - a.x;
    if(a.hi) a.hi.x = R2(a.hi.x + d);
    if(a.ho) a.ho.x = R2(a.ho.x + d);
    a.x = R2(v);
    build(); render(); syncInsp();
  });
const apiY = gestureField(F_Y, null, document.getElementById('n-fY'), document.querySelector('label[for="n-fY"]'),
  v => {
    const one = oneSel(); if(!one) return;
    const a = anchorAt(one); if(!a) return;
    const d = R2(v) - a.y;
    if(a.hi) a.hi.y = R2(a.hi.y + d);
    if(a.ho) a.ho.y = R2(a.ho.y + d);
    a.y = R2(v);
    build(); render(); syncInsp();
  });

function fitView(){
  /* パネルを開閉した直後は ResizeObserver がまだ走っておらず VW/VH が1フレーム古い。
     測り直す。ただし測れなかったときは前の寸法を使い、次の resize でやり直す。 */
  if(!fitCanvas() && (VW<2 || VH<2)){ pendingFit = true; return; }
  const b = contentBox(S.paths.map((_,i)=>i));
  if(!b){ S.view = {s:1, ox:VW/2, oy:VH/2}; return; }
  const w = Math.max(b.Mx-b.mx,1), h = Math.max(b.My-b.my,1), pad = 60;
  const s = Math.max(0.1, Math.min(12, Math.min((VW-pad*2)/w, (VH-pad*2)/h)));
  S.view.s = s;
  S.view.ox = (VW - w*s)/2 - b.mx*s;
  S.view.oy = (VH - h*s)/2 - b.my*s;
}

/* 選択した点を動かす（矢印＝グリッドの隣の線へ・⇧＝細かく）。ハンドルも一緒に動く */
function moveSel(ux, uy, shift){
  if(!S.sel.length) return;
  const g = S.grid.step;
  snap_();
  for(const s of S.sel){
    const a = anchorAt(s); if(!a) continue;
    let nx=a.x, ny=a.y;
    if(S.grid.snap && !shift){
      const step=(v,d)=> d>0 ? (Math.floor(v/g+1e-9)+1)*g : (Math.ceil(v/g-1e-9)-1)*g;
      if(ux) nx = R2(step(a.x,ux));
      if(uy) ny = R2(step(a.y,uy));
    } else {
      const st = shift ? (S.grid.snap?1:10) : 1;
      nx = R2(a.x+ux*st); ny = R2(a.y+uy*st);
    }
    if(a.hi){ a.hi = {x:R2(a.hi.x+nx-a.x), y:R2(a.hi.y+ny-a.y)}; }
    if(a.ho){ a.ho = {x:R2(a.ho.x+nx-a.x), y:R2(a.ho.y+ny-a.y)}; }
    a.x = nx; a.y = ny;
  }
  build(); render(); syncInsp();
}
/* 押している間だけ変わる状態（Space＝手のひら・Option＝シェイプ形成の札の文言）と、
   Studio.keys の extra が受けない ⌘ 付きの 2 つ（⌘J 連結・⌘H アンカー表示）。コマンドのキーは下の Studio.keys へ */
addEventListener('keydown', e=>{
  if(e.code==='Space') spaceDown = true;
  if(e.key==='Alt' && S.tool==='shapebuild' && HOVERXY){ HOVERXY.alt = true; render(); }
  if(!(e.metaKey || e.ctrlKey) || e.isComposing) return;
  if(document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if(k==='j' && !e.shiftKey){ e.preventDefault(); joinSelected(); }
  if(k==='h' && !e.shiftKey){ e.preventDefault(); toggleAnchors(); }
});
addEventListener('keyup', e=>{
  if(e.code==='Space') spaceDown = false;
  if(e.key==='Alt' && S.tool==='shapebuild' && HOVERXY){ HOVERXY.alt = false; render(); }
});
cv.addEventListener('pointerleave', ()=>{
  if(S.tool==='shapebuild' && HOVER){ HOVER = null; render(); }
});
Studio.keys({
  undo: undo, redo: redo,
  copy: copySVG,
  pasteSVG: text => reportImport(importSVGText(text)),
  outline: toggleOutline,
  toggleColorTarget: toggleColorTarget, swapFillStroke: swapFillStroke,
  selectTool: () => setTool('select'),
  selectAll: selectAll,
  del: delSelected,
  pan: () => {},                                /* Space を押したままドラッグ＝手のひら（canvas 側の spaceDown が担う） */
  escSteps: [
    sb.closeDialog,                             /* 色の小窓 */
    () => {                                     /* 描いている途中のパス → シェイプ形成の印 → 選択 */
      const P = S.paths[S.cur];
      if(S.tool==='pen' && P && !P.closed && P.anchors.length){ finishPath(); return true; }
      if(S.tool==='shapebuild' && MARK.size){ MARK.clear(); syncShapeInfo(); render(); return true; }
      if(S.sel.length){ S.sel = []; render(); syncInsp(); return true; }
      return false;
    }
  ],
  extra: {
    'a': () => setTool('direct'), 'p': () => setTool('pen'), 'n': () => setTool('pencil'),
    'm': () => setTool('rect'), 'l': () => setTool('ellipse'), 'r': () => setTool('rotate'),
    'shift+m': () => setTool('shapebuild'),
    'arrowup': () => moveSel(0,-1,false),    'shift+arrowup': () => moveSel(0,-1,true),
    'arrowdown': () => moveSel(0,1,false),   'shift+arrowdown': () => moveSel(0,1,true),
    'arrowleft': () => moveSel(-1,0,false),  'shift+arrowleft': () => moveSel(-1,0,true),
    'arrowright': () => moveSel(1,0,false),  'shift+arrowright': () => moveSel(1,0,true)
  }
});

/* ---- 起動 ----
   開いた直後は、強みが分かる短い曲線（Bスプライン点とベジェ点が混在する1本）を青で版面の中央に大きく置く
   （006 §0 INIT-01）。次に描く線は新しいパスから始まる（この曲線を延ばさない）。 */
function initialPaths(){
  const bez = (x,y,hi,ho)=>{ const a = mkAnchor(x,y,'bezier'); a.hi = {x:hi[0],y:hi[1]}; a.ho = {x:ho[0],y:ho[1]}; return a; };
  return [
    {closed:false, fill:false, anchors:[
      mkAnchor(-140, 80,'spline'),
      mkAnchor( -80,-80,'spline'),
      bez(0, 40, [-40, 40], [40, 40]),
      mkAnchor(  80,-100,'spline'),
      mkAnchor( 140,  20,'spline')
    ]},
    {closed:false, fill:false, anchors:[]}
  ];
}
let pendingInit = false;
function initView(){
  if(!fitCanvas() && (VW<2 || VH<2)){ pendingFit = true; pendingInit = true; return; }
  const b = contentBox([0]);
  if(!b){ S.view = {s:1, ox:VW/2, oy:VH/2}; return; }
  const ext = Math.max(b.Mx-b.mx, b.My-b.my, 1);
  const sc = Math.max(0.2, Math.min(6, 0.6*Math.min(VW,VH)/ext));      /* 曲線の長辺＝版面の短辺の60% */
  S.view.s = sc;
  S.view.ox = VW/2 - (b.mx+b.Mx)/2*sc;
  S.view.oy = VH/2 - (b.my+b.My)/2*sc;
}
addEventListener('resize', resize);
new ResizeObserver(resize).observe(document.getElementById('stage'));
fitCanvas();
S.paths = initialPaths(); S.cur = 1;
build();
initView();
setTool('pen');
render(); syncInsp(); syncBar();

/* studio-apps: オフライン用の登録。https か localhost の時だけ動く */
(function(){
  if(!('serviceWorker' in navigator)) return;
  if(!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })
    .then(function(){
      console.info('studio-apps: オフライン準備完了');
      if(navigator.storage && navigator.storage.persist){
        navigator.storage.persist().then(function(ok){ console.info('studio-apps: 永続化 ' + (ok ? '許可' : '未許可')); });
      }
    })
    .catch(function(err){ console.info('studio-apps: オフライン準備に失敗', err); });
})();
