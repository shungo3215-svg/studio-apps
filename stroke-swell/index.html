/* --- 版面（§13 VID-01）。大きさ（4:5 等）に合わせて表示・書き出しの範囲を決める。短い方の辺を

var frameBox = null;
function setFrame(pxW, pxH, key) {
  var a = pxW / pxH, fw = 2 * HALF, fh = 2 * HALF;

  var m = Math.max(fw, fh) * 0.06;

function drawFrameGuide() {
  if (!frameBox) return;
  var f = frameBox, g = document.createElementNS(SVGNS, 'g');

  var r = document.createElementNS(SVGNS, 'rect');
  r.setAttribute('x', f.x); r.setAttribute('y', f.y); r.setAttribute('width', f.w); r.setAttribute('height', f.h);
  r.setAttribute('fill', 'none'); r.setAttribute('stroke', '#8A8A8A'); r.setAttribute('stroke-width', 1);
  r.setAttribute('stroke-dasharray', '4 3'); r.setAttribute('vector-effect', 'non-scaling-stroke');
  g.appendChild(r);
  var y = f.y - Math.max(f.w, f.h) * 0.03, tick = Math.max(f.w, f.h) * 0.012;
  function line(x1, y1, x2, y2) {
    var l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', '#8A8A8A'); l.setAttribute('stroke-width', 1); l.setAttribute('vector-effect', 'non-scaling-stroke');
    g.appendChild(l);
  }
  line(f.x, y, f.x + f.w, y); line(f.x, y - tick, f.x, y + tick); line(f.x + f.w, y - tick, f.x + f.w, y + tick);
  var t = document.createElementNS(SVGNS, 'text');

}

  if (s.fitTol != null) values.set('fitTol', s.fitTol);
  if (s.fill != null) colorState.fill = s.fill;
  if (s.fillLayer != null) colorState.fillLayer = s.fillLayer;
  if (s.bg != null) colorState.bg = s.bg;
  if (sb && sb.colors) { sb.colors.set('fill', colorState.fill); sb.colors.set('fillLayer', colorState.fillLayer); sb.colors.set('bg', colorState.bg); }
  updatePillarRowsVisibility();
  updateRuleRowsVisibility();
  updateRuleDRowsVisibility();
  updateDepthLinkVisibility();

}

/* --- 取り込み ------------------------------------------------------------- */
function setError(msg) { errBar.textContent = msg; }
function clearError() { errBar.textContent = ''; }

function scaleSeg(s, k) {
  function p(pt) { return [pt[0] * k, pt[1] * k]; }
  return s.type === 'L' ? { type: 'L', a: p(s.a), b: p(s.b) } : { type: 'C', p0: p(s.p0), p1: p(s.p1), p2: p(s.p2), p3: p(s.p3) };
}

function loadSourceSvg(text, skipHistory, shrink) {
  var shapes = null;
  try { shapes = window.SvgIn.parse(text); } catch (e) { shapes = null; }
  if (!shapes || !shapes.length) { setError('SVGを読めませんでした（対応する図形が見つからないか、SVGの形式が不正です）'); return false; }
  if (shapes.length !== 1) {
    setError('閉じたパス1本だけ受け付けます（' + shapes.length + '本あります）');
    return false;
  }
  if (!shapes[0].closed) {
    setError('開いたパスです。閉じたパスを貼ってください');
    return false;
  }
  var segsWorld = shapes[0].segs.map(function (s) { return scaleSeg(s, HALF * (shrink || 1)); });
  state.segsWorld = segsWorld;
  state.baseD = window.Geom.toD(segsWorld, true);
  state.sourceText = text;
  if (!skipHistory) { state.points = []; state.selected = -1; updateSelectedRowsVisibility(); }
  clearError();
  render();
  if (!skipHistory) pushHistory();
  return true;
}

/* --- 段4: 補間の切替（柱を通す=Catmull-Rom／なめらか=周期一様3次Bスプライン）。
   3D回転パイプラインと幅・奥行きのグラフの曲線表示に使う。正面（角度0,0）の輪郭は
   Outline.buildOutline（smoothstep）のまま変えない＝x,yの見え方は絶対に変わらない
   （ユーザー決定「元の平面からの見え方キープ」）。 --------------------------------- */
function interpAt(sortedPoints, t, baseWidth, mode) {
  if (mode === 'bspline' && sortedPoints.length >= 3) {
    var ts = sortedPoints.map(function (p) { return p.t; });
    var leftVals = sortedPoints.map(function (p) { return p.left; });
    var rightVals = sortedPoints.map(function (p) { return p.right; });
    return { left: Profile.bsplineClosed(leftVals, ts, t), right: Profile.bsplineClosed(rightVals, ts, t) };
  }
  return Outline.widthAtSmooth(sortedPoints, t, baseWidth);
}

/* --- 描画 ------------------------------------------------------------- */
/* --- 段3: 奥行き・回転・投影 --------------------------------------------
   中心線の密サンプル (x,y,z(t)) を2つの角度で回転→正射投影→2D点列。
   帯（幅の輪郭）は投影後の中心線に対して法線を取り直して作る（w(t)は平面上の値のまま）。
   正面（両角度0）のときは Outline.buildOutline の結果をそのまま使う（1本の帯・軽量・
   既存の出力とビット互換）。回っているときだけ小片に分けて前後関係を付ける。 --- */
/* --- インスタONで絵を版面に収める（006 §0・Studio.fitInto）。------------------
   「回しても変わらない外接」= 中心線サンプル（回転角より前・回しても値は変わらない）に
   奥行きzと帯の半幅を足した、原点からの3D距離の最大を半径とする円。
   AとBが記録済みならその両方の半径の大きい方を使う（kit側sb.getAB()。A/B再生・映像
   書き出し中に揺れないため）。ドラッグ中は直前の値を使い回す（掴んだ点が逃げないように）。 --- */
function stableRawPoints3D() {
  var out = state.outline; if (!out) return [];
  var ts = out.ts, baseSamples = out.samples;
  var spanFactor = (values.depthSpanPct != null ? values.depthSpanPct : 60) / 100;
  var zAt;
  if (values.depthLinked) {
    var pctArr = linkedDepthPctArray(ts);
    zAt = pctArr.map(function (pct) { return depthPercentToPx(pct * spanFactor); });
  } else {
    var depthPts = effectiveDepthPoints();
    var sortedDepth = depthPts.slice().sort(function (a, b) { return a.t - b.t; }).map(function (p) { return { t: p.t, left: p.z, right: p.z }; });
    zAt = baseSamples.map(function (p, i) {
      var pct = sortedDepth.length ? interpAt(sortedDepth, ts[i], 0, values.interpD).left : 0;
      return depthPercentToPx(pct * spanFactor);

  }
  var widthPts = effectiveWidthPoints();
  var sortedWidth = widthPts.slice().sort(function (a, b) { return a.t - b.t; });
  return baseSamples.map(function (p, i) {
    var w = interpAt(sortedWidth, ts[i], values.baseWidth, values.interp);
    return { x: p[0], y: p[1], z: zAt[i] || 0, hw: Math.max(w.left, w.right) };
  });
}
function safeRadiusFromParamsSnapshot(p) {
  var before = null;
  if (p) { before = {}; Object.keys(values).forEach(function (k) { before[k] = values[k]; }); applyParamsToState(p); }
  var pts = stableRawPoints3D();
  var R = 0;
  pts.forEach(function (pt) {
    var d = Math.sqrt(pt.x * pt.x + pt.y * pt.y + pt.z * pt.z) + (pt.hw || 0);
    if (d > R) R = d;

}
function safeRadius3D() {
  var ab = sb.getAB();
  if (ab.A && ab.B) return Math.max(safeRadiusFromParamsSnapshot(ab.A), safeRadiusFromParamsSnapshot(ab.B));
  return safeRadiusFromParamsSnapshot(null);
}
function insta() { return !document.body.classList.contains('insta-off'); }
var cachedFitSS = null, isDraggingSS = false;
function computeFitTransformSS() {
  if (!insta()) return null;
  if (isDraggingSS && cachedFitSS) return cachedFitSS;
  var R = safeRadius3D();
  var fb = frameBox || { x: -HALF, y: -HALF, w: HALF * 2, h: HALF * 2 };
  cachedFitSS = Studio.fitInto({ x: -R, y: -R, w: 2 * R, h: 2 * R }, { x: fb.x, y: fb.y, w: fb.w, h: fb.h }, 0.08);
  return cachedFitSS;
}

function computeProjection() {
  var out = state.outline; // Outline.buildOutline() 済み（samples/ts/normalsはbuildOutline基準）
  var ts = out.ts, baseSamples = out.samples;
  var isFront = Math.abs(values.angleX) < 1e-9 && Math.abs(values.angleY) < 1e-9;
  var spanFactor = (values.depthSpanPct != null ? values.depthSpanPct : 60) / 100; // 「深さ」＝軸いっぱい(-50〜+50%)に対する掛け目
  var zAt;
  if (values.depthLinked) {
    // 段5:「線幅に連動」ON。幅の曲線（現在の補間モード込み）を毎フレーム密にサンプルし、
    // その最小→最大を−50〜+50%に写す（Depth.linkedDepth）。奥行きの柱(state.depthPoints)は使わない。
    var pctArr = linkedDepthPctArray(ts);
    zAt = pctArr.map(function (pct) { return depthPercentToPx(pct * spanFactor); });
  } else {
    // 連動OFF: 奥行きの柱（規則で作った独自の曲線）をそのまま使う（従来どおり）。
    var depthPts = effectiveDepthPoints(); // z は%（-50〜+50）
    var sortedDepth = depthPts.slice().sort(function (a, b) { return a.t - b.t; }).map(function (p) { return { t: p.t, left: p.z, right: p.z }; });
    zAt = baseSamples.map(function (p, i) {
      var pct = sortedDepth.length ? interpAt(sortedDepth, ts[i], 0, values.interpD).left : 0;
      return depthPercentToPx(pct * spanFactor); // 3D計算だけpxに変換
    });
  }

  if (isFront) {
    // 正面: 奥行き0相当。既存の帯（out.left/right/d）をそのまま使う軽量パス。
    return {
      ts: ts, proj2D: baseSamples, z: zAt.map(function () { return 0; }), left: out.left, right: out.right,
      isFront: true, fillD: state.baseD, bandD: out.d
    };
  }

  var pts3D = baseSamples.map(function (p, i) { return [p[0], p[1], zAt[i]]; });
  var ts3D = ts;
  var rotated = Depth.rotateProject(pts3D, values.angleX, values.angleY);
  var proj2D = rotated.map(function (r) { return [r.x, r.y]; });
  var zArr = rotated.map(function (r) { return r.z; });
  var normals2 = Outline.normalsFor(proj2D);
  // 固定軸の50%分のpxで正規化してからsを掛ける＝「奥行きの深さ」設定を変えても効き方が一定になる
  var halfSpanForScale = depthPercentToPx(DEPTH_AXIS_MAX) || 1;
  var widthPts = effectiveWidthPoints();
  var sortedWidth = widthPts.slice().sort(function (a, b) { return a.t - b.t; });
  var leftW = [], rightW = [];
  for (var i = 0; i < proj2D.length; i++) {
    var w = interpAt(sortedWidth, ts3D[i], values.baseWidth, values.interp);
    var sFactor = 1 + (values.frontScale || 0) * (zArr[i] / halfSpanForScale);
    leftW.push(Math.max(0, w.left * sFactor));
    rightW.push(Math.max(0, w.right * sFactor));
  }
  // 段4: 折り返し（法線が急に回る箇所）を半円弧で丸める＝「中心線に沿って円を掃いた形」
  var rounded = Depth.roundHairpinCorners(proj2D, normals2, leftW, rightW, CORNER_THRESHOLD_DEG, CORNER_ARC_STEPS);
  var left = rounded.left, right = rounded.right;
  var bandZ = rounded.sourceIdx.map(function (idx) { return zArr[idx]; });
  var fillSegs = Outline.catmullRomClosedSegments(proj2D);
  var fillD = Outline.segsToClosedD(fillSegs);
  return { ts: ts3D, proj2D: proj2D, z: zArr, left: left, right: right, bandZ: bandZ, isFront: false, fillD: fillD };
}

/* 段8: 自己接近の無い全周1本の帯を、直線つなぎの閉じたリングとして描く（画面表示・PNG/動画用。
   pieceDのような「開いたリボン＋両端キャップ」構造ではなく、単純な閉じた多角形を1本返す
   （呼び出し側で外周・内周の2本をそれぞれこの関数で作り、内周は逆順で渡して重ねる）。 */
function plainClosedD(pts) {
  function f(p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }
  var d = 'M' + f(pts[0]);
  for (var i = 1; i < pts.length; i++) d += 'L' + f(pts[i]);
  return d + 'Z';
}
/* 投影後の帯を小片に分けたSVG片のd文字列（開いた短冊。直線でつなぐ＝十分に小さいので滑らかに見える） */
function pieceD(left, right, idxs) {
  function f(p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }
  var d = 'M' + f(left[idxs[0]]);
  for (var i = 1; i < idxs.length; i++) d += 'L' + f(left[idxs[i]]);
  for (var j = idxs.length - 1; j >= 0; j--) d += 'L' + f(right[idxs[j]]);
  return d + 'Z';
}
/* 段6: 書き出し専用・小片ごとに外周・内周を曲線フィットしてアンカー数を減らす版
   （画面表示のpieceDはそのまま・直線つなぎ）。小片はもともと数点しかないので大抵1〜2本の
   ベジェに収まる。小片どうしの継ぎ目（前後関係の演出上のseam）はそのまま角として残す
   （ユーザー決定の「角として扱わない」対象は丸めた折り返し部だけ・小片境界は含まない）。 */
function pieceDFitted(left, right, idxs, tol) {
  function f(p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }
  var leftPts = idxs.map(function (i) { return left[i]; });
  var rightPts = idxs.slice().reverse().map(function (i) { return right[i]; });
  var segsL = Fit.fitOpenPolyline(leftPts, tol);
  var segsR = Fit.fitOpenPolyline(rightPts, tol);
  var d = 'M' + f(leftPts[0]);
  segsL.forEach(function (s) { d += 'C' + f(s.p1) + ' ' + f(s.p2) + ' ' + f(s.p3); });
  d += 'L' + f(rightPts[0]); // 遠い側の端（左端→右端）は直線でつなぐ（元のpieceDと同じ）
  segsR.forEach(function (s) { d += 'C' + f(s.p1) + ' ' + f(s.p2) + ' ' + f(s.p3); });
  return d + 'Z'; // 近い側の端（右端→左端の始点）もZの直線でつなぐ（元のpieceDと同じ）
}

/* 段6: 閉じた点列 → フィット済みのd文字列（forExportのときだけ呼ぶ。画面表示は密サンプルの
   ままOutline.catmullRomClosedSegmentsを使う＝この関数は書き出し専用）。 */
/* 段10: 曲線フィットの許容誤差（パネルの「帯のなめらかさ」）。未設定・不正値は既定0.5。 */
function fitTolNow() {
  var v = (typeof values !== 'undefined' && values) ? values.fitTol : null;
  return (typeof v === 'number' && isFinite(v) && v > 0) ? v : FIT_TOL_DEFAULT;
}
function fittedClosedD(pts) {
  var segs = Fit.fitClosedPolyline(pts, fitTolNow());
  return Fit.segsToD(segs, true);
}

function buildLayers(proj, forExport, rasterSeal) {
  // 戻り値: {fillEl, bandEl, centerEl}（<g>要素。呼び出し側がSVGに追加する）
  var fillD = forExport ? fittedClosedD(proj.proj2D) : proj.fillD;
  var gFill = document.createElementNS(SVGNS, 'g'); gFill.id = 'fill';
  var pFill = document.createElementNS(SVGNS, 'path');
  pFill.setAttribute('d', fillD);
  pFill.setAttribute('fill', colorState.fillLayer === 'none' ? 'none' : colorState.fillLayer);
  pFill.setAttribute('fill-rule', 'evenodd');
  gFill.appendChild(pFill);

  var gBand = document.createElementNS(SVGNS, 'g'); gBand.id = 'band';
  var fillColor = colorState.fill === 'none' ? 'none' : colorState.fill;
  if (proj.isFront) {
    var pBand = document.createElementNS(SVGNS, 'path');
    pBand.setAttribute('class', 'fillshape');
    if (forExport) {
      // 段6: 外周(left)・内周(right)をそれぞれ閉曲線としてフィットし直す（画面はproj.bandDのまま）
      pBand.setAttribute('d', fittedClosedD(proj.left) + ' ' + fittedClosedD(proj.right.slice().reverse()));
    } else {
      pBand.setAttribute('d', proj.bandD);
    }

    pBand.setAttribute('fill-rule', 'nonzero');

  } else {

    // 半幅（left-right間距離の半分）から、自分自身に近づく区間だけ検出して細かく割る。
    var midSamples = [], halfWidths = [];
    for (var mi = 0; mi < proj.left.length; mi++) {
      var L = proj.left[mi], R = proj.right[mi];
      midSamples.push([(L[0] + R[0]) / 2, (L[1] + R[1]) / 2]);
      halfWidths.push(Math.hypot(L[0] - R[0], L[1] - R[1]) / 2);
    }
    // 段7-3: 動画・PNG（ラスタ化）だけ小片の重なりを2サンプルにし、同色0.5pxのstroke
    // （stroke-linejoin round）を足して継ぎ目（白い細線）を埋める。SVG書き出しはstrokeを
    // 付けない（Illustratorで合体して使うため・ユーザー決定）。
    var split = Depth.splitBandAdaptive(midSamples, halfWidths, proj.bandZ || proj.z, { overlap: rasterSeal ? 3 : 1 });
    // 段8で発見した実バグ: 自己接近が一度も無い形（回しても1個の片のまま）のとき、
    // splitBandAdaptiveはidxsに折り返し用の重ね点を足さず[0..n-1]をそのまま返す
    // （隣に別の片が無い＝重ねる相手がいないため、意図的に足していない）。この1個の片を
    // 従来のpieceD（帯＝開いたリボン＋両端をまっすぐ閉じる構造）で描くと、indices[0]と
    // indices[last]は実際には隣り合う密サンプル同士（弧長で1コマぶんしか離れていない）
    // なのに、それぞれの端で独立に「左右をまっすぐ結ぶキャップ」を描いてしまい、
    // 2つのキャップの間に細い隙間が残っていた（ユーザー報告「始点だけ角がつく／
    // 動画末尾フレームの隙間」の正体＝どちらも絶対t=0（配列の継ぎ目）に固定で出ていた。
    // t0を動かしても隙間の画面位置が動かないことを確認して切り分けた）。
    // 修正: 1個の片が輪郭全周（indices.length===n）のときだけ、リボン構造をやめて
    // 前面表示と同じ「外周の閉じたリング＋内周の閉じたリング（逆回り）」の2本構成にする
    // （キャップという概念自体を無くす＝継ぎ目が原理的に出ない）。
    var isFullLoopSinglePiece = split.sequential.length === 1 && split.sequential[0].indices.length === proj.left.length;
    if (isFullLoopSinglePiece) {

      } else {

      }
      p.setAttribute('fill', fillColor);
      p.setAttribute('fill-rule', 'nonzero');

      split.byDepth.forEach(function (piece) {

        p.setAttribute('d', forExport ? pieceDFitted(proj.left, proj.right, piece.indices, fitTolNow()) : pieceD(proj.left, proj.right, piece.indices));
        p.setAttribute('fill', fillColor);
        p.setAttribute('fill-rule', 'nonzero');
        if (rasterSeal && fillColor !== 'none') {
          p.setAttribute('stroke', fillColor);
          p.setAttribute('stroke-width', '0.5');
          p.setAttribute('stroke-linejoin', 'round');
        }

  }

  var gCenter = document.createElementNS(SVGNS, 'g'); gCenter.id = 'center';
  var pCenter = document.createElementNS(SVGNS, 'path');
  pCenter.setAttribute('class', 'center');
  pCenter.setAttribute('stroke', '#999999'); pCenter.setAttribute('stroke-width', '0.5'); pCenter.setAttribute('fill', 'none');
  if (forExport) {
    pCenter.setAttribute('d', fillD); // fillDと同じ点列(proj.proj2D)を段6でフィット済み＝使い回す
  } else {
    var centerSegs = Outline.catmullRomClosedSegments(proj.proj2D);
    pCenter.setAttribute('d', Outline.segsToClosedD(centerSegs));
  }
  gCenter.appendChild(pCenter);

  return { fillEl: gFill, bandEl: gBand, centerEl: gCenter };
}

/* 段6: ドラッグ中の連続pointermoveをrequestAnimationFrameで1フレーム1回に合流させる。
   ドラッグ操作（点・回転・グラフハンドル）だけに使う（パネル操作・ボタンは従来どおり即render）。
   ポインタが動くたびに毎回render()していたのを、次の描画フレームまでにまとめる＝
   イベント発生レートが画面のフレームレートより高い環境（高頻度pointermove）での重さを減らす。 */
var renderScheduled = false;
function scheduleRender() {

  renderScheduled = true;

}

/* 段6 性能改善: 平坦化・弧長パラメータ・法線（パス=segsWorldだけに依存し、
   baseWidth/points/角度/奥行きが変わっても変化しない）を、segsWorldの参照が
   変わらない限りキャッシュして使い回す（毎render()ごとの再平坦化をやめる）。 */
var geomCache = { segs: null, geom: null };
function getGeomCached() {
  if (geomCache.segs !== state.segsWorld) {
    geomCache.geom = Outline.computeGeom(state.segsWorld, TOL, MAX_LINE_STEP);
    geomCache.segs = state.segsWorld;
  }
  return geomCache.geom;
}

function render() {
  canvas.innerHTML = '';
  // §13 VID-01: 背景は版面の中だけに塗る。「なし」はCSSの既定（var(--surface)）に戻す。
  if (frameBox && colorState.bg && colorState.bg !== 'none') {
    var fbg = document.createElementNS(SVGNS, 'rect');
    fbg.setAttribute('x', frameBox.x); fbg.setAttribute('y', frameBox.y);
    fbg.setAttribute('width', frameBox.w); fbg.setAttribute('height', frameBox.h);
    fbg.setAttribute('fill', colorState.bg); fbg.setAttribute('pointer-events', 'none');
    canvas.appendChild(fbg);

  var out = Outline.buildOutline(state.segsWorld, values.baseWidth, state.points, { tol: TOL, maxLineStep: MAX_LINE_STEP, geom: getGeomCached() });
  state.outline = out;
  var proj = computeProjection();
  state.proj = proj;

  // 絵（塗り層・帯・中心線・アンカー）を版面に収めるグループ（006 §0）。ポインタのCTM
  // 逆変換もこのグループを基準にする（svgPointFromEvent）。
  canvasArtGroup = document.createElementNS(SVGNS, 'g');
  canvasArtGroup.setAttribute('class', 'fit-art');
  var fitSS = computeFitTransformSS();
  if (fitSS) canvasArtGroup.setAttribute('transform', fitSS.transform);
  canvas.appendChild(canvasArtGroup);

  var layers = buildLayers(proj, false);
  if (values.showFillLayer) canvasArtGroup.appendChild(layers.fillEl);
  if (values.showBand) canvasArtGroup.appendChild(layers.bandEl);

  if (values.guide) {
    canvasArtGroup.appendChild(layers.centerEl);

    var gPts = document.createElementNS(SVGNS, 'g');
    gPts.setAttribute('id', 'ptsLayer');
    state.points.forEach(function (p, i) {
      var pos = projPointAt(p.t);
      var g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'pt' + (i === state.selected ? ' sel' : ''));
      g.dataset.idx = String(i);
      var c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', pos[0]); c.setAttribute('cy', pos[1]); c.setAttribute('r', 6);
      g.appendChild(c);
      gPts.appendChild(g);
    });
    canvasArtGroup.appendChild(gPts);

    // 起点マーク（▶）。幅のグラフの横軸0%はここ
    var t0pos = projPointAt(state.t0);
    var t0n = sampleAt(state.t0);
    if (t0n) {
      var ang = Math.atan2(t0n.n[1], t0n.n[0]) - Math.PI / 2; // 進行方向（接線・平面基準の近似）
      var tri = document.createElementNS(SVGNS, 'path');
      var s = 9;
      tri.setAttribute('d', 'M ' + s + ' 0 L ' + (-s * 0.6) + ' ' + (s * 0.7) + ' L ' + (-s * 0.6) + ' ' + (-s * 0.7) + ' Z');
      tri.setAttribute('class', 't0mark');
      tri.setAttribute('transform', 'translate(' + t0pos[0] + ' ' + t0pos[1] + ') rotate(' + (ang * 180 / Math.PI) + ')');
      canvasArtGroup.appendChild(tri);
    }
  }
  renderGraph();
  renderDepthGraph();
  scheduleAnchorCount();
}

/* --- 幅のグラフの描画（キャンバスの下・イージングカーブエディタと同じ見え方） ------
   横軸=表示t（起点t0・向きreversed基準の0..1）。縦軸=幅(px)。
   左右対称のときは1本、「左右を別々にする」ONのときは2本（左・右）の折れ線＋ハンドル。 -- */
function graphX(disp) { return GRAPH_PAD_X + disp * (GRAPH_W - GRAPH_PAD_X * 2); }
function graphMaxW() {
  var m = values.baseWidth || 6;
  effectiveWidthPoints().forEach(function (p) { m = Math.max(m, p.left, p.right); });
  return Math.max(20, m * 1.25);
}
function graphY(w, maxW) { return GRAPH_H - GRAPH_PAD_B - (w / maxW) * (GRAPH_H - GRAPH_PAD_B - GRAPH_PAD_T); }

function renderGraph() {
  graph.innerHTML = '';
  if (!state.segsWorld) return;
  var maxW = graphMaxW();
  var effPoints = effectiveWidthPoints();
  var sortedAbs = effPoints.slice().sort(function (a, b) { return a.t - b.t; });

  // 目盛線（柱の位置に立つ縦線）
  var gTicks = document.createElementNS(SVGNS, 'g');
  effPoints.forEach(function (p) {
    var disp = Profile.toDisplayT(p.t, state.t0, state.reversed);
    var x = graphX(disp);
    var l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('class', 'gtick');
    l.setAttribute('x1', x); l.setAttribute('y1', GRAPH_PAD_T); l.setAttribute('x2', x); l.setAttribute('y2', GRAPH_H - GRAPH_PAD_B);
    gTicks.appendChild(l);
  });
  graph.appendChild(gTicks);

  // 補間曲線（outline.js の widthAt と同じ補間を、表示t刻みでサンプルして薄く描く）
  var N = 240;
  function curvePath(side) {
    var d = '';
    for (var i = 0; i <= N; i++) {
      var disp = i / N;
      var abs = Profile.toAbsoluteT(disp, state.t0, state.reversed);
      var w = interpAt(sortedAbs, abs, values.baseWidth, values.interp);
      var v = side === 'right' ? w.right : w.left;
      var x = graphX(disp), y = graphY(v, maxW);
      d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  }
  var curveL = document.createElementNS(SVGNS, 'path');
  curveL.setAttribute('class', 'gcurve');
  curveL.setAttribute('d', curvePath('left'));
  graph.appendChild(curveL);
  if (values.splitLR) {
    var curveR = document.createElementNS(SVGNS, 'path');
    curveR.setAttribute('class', 'gcurve right');
    curveR.setAttribute('d', curvePath('right'));
    graph.appendChild(curveR);
  }

  // ハンドル（柱ごと。左右対称なら1個、分離なら2個）
  effPoints.forEach(function (p, i) {
    var disp = Profile.toDisplayT(p.t, state.t0, state.reversed);
    var x = graphX(disp);
    function handle(side, val) {
      var g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('class', 'ghandle' + (side === 'right' ? ' right' : '') + (i === state.selected ? ' sel' : ''));
      g.dataset.idx = String(i); g.dataset.side = side;
      var c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', graphY(val, maxW)); c.setAttribute('r', 6);
      g.appendChild(c);
      graph.appendChild(g);
    }
    if (values.splitLR) { handle('left', p.left); handle('right', p.right); }
    else handle('left', p.left);
  });

  // 起点マーク（グラフ左端=0%）
  var g0 = document.createElementNS(SVGNS, 'path');
  var gx = graphX(0), s2 = 6;
  g0.setAttribute('d', 'M ' + gx + ' ' + (GRAPH_H - 10) + ' L ' + (gx - s2) + ' ' + (GRAPH_H - 2) + ' L ' + (gx + s2) + ' ' + (GRAPH_H - 2) + ' Z');
  g0.setAttribute('class', 'g0mark');
  graph.appendChild(g0);

  // 段5:「線幅に連動」ONのとき、右端に奥行きの%目盛りを併記する（同じ曲線を幅・奥行き
  // 両方として読む。反転時は上下逆＝太い側が奥%になる高さに合わせて目盛りのラベルだけ入れ替える）。
  if (values.depthLinked) {
    var widthsForAxis = [];
    for (var ai = 0; ai <= N; ai++) {
      var adisp = ai / N;
      var aabs = Profile.toAbsoluteT(adisp, state.t0, state.reversed);
      widthsForAxis.push(widthAvgAtT(sortedAbs, aabs));
    }
    var axisMin = Math.min.apply(null, widthsForAxis), axisMax = Math.max.apply(null, widthsForAxis);
    var axisRange = axisMax - axisMin;
    var gAxis = document.createElementNS(SVGNS, 'g');
    [-50, -25, 0, 25, 50].forEach(function (pct) {
      var raw = values.depthInvert ? -pct : pct;
      var u = (raw / 50 + 1) / 2;
      var w = axisRange < 1e-9 ? axisMin : axisMin + axisRange * u;
      var y = graphY(w, maxW);
      var l = document.createElementNS(SVGNS, 'line');
      l.setAttribute('class', 'gdaxis-line');
      l.setAttribute('x1', GRAPH_W - GRAPH_PAD_X - 6); l.setAttribute('y1', y);
      l.setAttribute('x2', GRAPH_W - GRAPH_PAD_X); l.setAttribute('y2', y);
      gAxis.appendChild(l);
      var t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('class', 'gdaxis-text');
      t.setAttribute('x', GRAPH_W - 2); t.setAttribute('y', y + 3);
      t.setAttribute('text-anchor', 'end');
      t.textContent = (pct > 0 ? '+' : '') + pct + '%';
      gAxis.appendChild(t);
    });
    graph.appendChild(gAxis);
  }
}

/* --- 奥行きのグラフの描画。横軸は幅のグラフと同じ表示t。縦軸はz（%・0が中央・手前+/奥-）。
   縦いっぱいは常に-50〜+50%固定（2026-09-24変更・ユーザー指摘「奥行きのグラフの数値の幅が
   狭い」。リンク中の従属曲線も含め、pxではなく図形の長辺に対する%で統一する）。 -- */
function depthGraphMaxAbs() {
  return DEPTH_AXIS_MAX;
}
function dgraphX(disp) { return GRAPH_PAD_X + disp * (GRAPH_W - GRAPH_PAD_X * 2); }
function dgraphY(z, maxAbs) { return DGRAPH_PAD_T + (DGRAPH_H - DGRAPH_PAD_T - DGRAPH_PAD_B) * (1 - (z / maxAbs + 1) / 2); }

function renderDepthGraph() {
  depthGraph.innerHTML = '';
  if (!state.segsWorld) return;
  if (values.depthLinked) return; // 段5: 連動ONのときは奥行きのグラフ自体を出さない（CSSでも非表示）
  var maxAbs = depthGraphMaxAbs();
  var effDepth = effectiveDepthPoints();
  var sortedAbs = effDepth.slice().sort(function (a, b) { return a.t - b.t; }).map(function (p) { return { t: p.t, left: p.z, right: p.z }; });

  var gTicks = document.createElementNS(SVGNS, 'g');
  effDepth.forEach(function (p) {
    var x = dgraphX(Profile.toDisplayT(p.t, state.t0, state.reversed));
    var l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('class', 'gtick');
    l.setAttribute('x1', x); l.setAttribute('y1', DGRAPH_PAD_T); l.setAttribute('x2', x); l.setAttribute('y2', DGRAPH_H - DGRAPH_PAD_B);
    gTicks.appendChild(l);
  });
  depthGraph.appendChild(gTicks);

  // 0（元の平面）の水平線
  var zeroY = dgraphY(0, maxAbs);
  var zl = document.createElementNS(SVGNS, 'line');
  zl.setAttribute('class', 'gzero');
  zl.setAttribute('x1', GRAPH_PAD_X); zl.setAttribute('y1', zeroY); zl.setAttribute('x2', GRAPH_W - GRAPH_PAD_X); zl.setAttribute('y2', zeroY);
  depthGraph.appendChild(zl);

  var N = 240, d = '';
  for (var i = 0; i <= N; i++) {
    var disp = i / N;
    var abs = Profile.toAbsoluteT(disp, state.t0, state.reversed);
    var z = sortedAbs.length ? interpAt(sortedAbs, abs, 0, values.interpD).left : 0;
    var x = dgraphX(disp), y = dgraphY(z, maxAbs);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  var curve = document.createElementNS(SVGNS, 'path');
  curve.setAttribute('class', 'gcurve');
  curve.setAttribute('d', d);
  depthGraph.appendChild(curve);

  effDepth.forEach(function (p, i) {
    var x = dgraphX(Profile.toDisplayT(p.t, state.t0, state.reversed));
    var g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'ghandle' + (i === state.selected ? ' sel' : ''));
    g.dataset.idx = String(i);
    var c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', dgraphY(p.z, maxAbs)); c.setAttribute('r', 6);
    g.appendChild(c);
    depthGraph.appendChild(g);
  });

  var g0 = document.createElementNS(SVGNS, 'path');
  var gx = dgraphX(0), s2 = 6;
  g0.setAttribute('d', 'M ' + gx + ' ' + (DGRAPH_H - 8) + ' L ' + (gx - s2) + ' ' + DGRAPH_H + ' L ' + (gx + s2) + ' ' + DGRAPH_H + ' Z');
  g0.setAttribute('class', 'g0mark');
  depthGraph.appendChild(g0);
}

/* t（弧長比）に対応する世界座標・法線・接線を、outline.js の密サンプルから求める（平面基準・当たり判定用） */
function sampleAt(t) {
  var out = state.outline;
  if (!out || !out.samples.length) return null;
  var ts = out.ts, n = ts.length, best = 0, bestD = Infinity;
  for (var i = 0; i < n; i++) {
    var d = Math.min(Math.abs(ts[i] - t), Math.abs(ts[i] - t - 1), Math.abs(ts[i] - t + 1));
    if (d < bestD) { bestD = d; best = i; }
  }
  return { p: out.samples[best], n: out.normals[best], idx: best, t: ts[best] };
}
function pointAtT(t) { var s = sampleAt(t); return s ? s.p : [0, 0]; }
/* 投影後（回転後）の画面表示位置。幅ポイントのハンドル・起点マークの見た目に使う
   （当たり判定はnearestTToPoint/sampleAtのまま平面基準＝★人が実操作で違和感を確認する余地あり）。 */
function projPointAt(t) {
  if (!state.proj) return pointAtT(t);
  var ts = state.proj.ts, n = ts.length, best = 0, bestD = Infinity;
  for (var i = 0; i < n; i++) {
    var d = Math.min(Math.abs(ts[i] - t), Math.abs(ts[i] - t - 1), Math.abs(ts[i] - t + 1));
    if (d < bestD) { bestD = d; best = i; }
  }
  return state.proj.proj2D[best];
}

/* クリック位置に最も近い中心線サンプルの t を返す（getPointAtLength は使わない） */
function nearestTToPoint(pt) {
  var out = state.outline;
  if (!out || !out.samples.length) return { t: 0, dist: Infinity, idx: 0 };
  var best = 0, bestD = Infinity;
  for (var i = 0; i < out.samples.length; i++) {
    var d = Math.hypot(out.samples[i][0] - pt[0], out.samples[i][1] - pt[1]);
    if (d < bestD) { bestD = d; best = i; }
  }
  return { t: out.ts[best], dist: bestD, idx: best };
}

/* --- 幅ポイントの編集: 選択・追加・削除・並べ替え -------------------------- */
function sortPointsKeepSelection() {
  var sel = state.selected >= 0 ? state.points[state.selected] : null;
  state.points.sort(function (a, b) { return a.t - b.t; });
  state.selected = sel ? state.points.indexOf(sel) : -1;
}
function selectPoint(i) {
  state.selected = i;
  updateSelectedRowsVisibility();
  if (i >= 0) syncPanelFromSelected();
  render();
}
function deleteSelected() {
  if (state.selected < 0) return;
  state.points.splice(state.selected, 1);
  state.selected = -1;
  updateSelectedRowsVisibility();
  pushHistory();
  render();
}
function resetPoints() {
  state.points = [];
  state.selected = -1;
  updateSelectedRowsVisibility();
  pushHistory();
  render();
}

/* --- 幅のグラフ: 柱の並び・規則の適用 --------------------------------------
   柱の位置（絶対t）は「柱の置き方」から決まる。
     アンカーごと = 元パスのアンカーポイント（Profile.anchorTs）
     等間隔       = 本数ぶんの等間隔（Profile.evenTs）
     自由         = 今の state.points の t をそのまま使う（並び順だけ表示t順に）
   規則（すべて同じ・交互・波・だんだん）は、この柱の並びに幅（左右対称値）を
   一括で割り当てる。適用後は個々のハンドルで自由に上書きできる（毎回re-generateはしない）。 -- */
function currentOrderedTs() {
  if (!state.segsWorld) return [];
  if (values.pillarMode === 'anchor') {
    return Profile.anchorTs(Outline, state.segsWorld, TOL, MAX_LINE_STEP, state.t0, state.reversed);
  }
  if (values.pillarMode === 'even') {
    return Profile.evenTs(values.evenCount, state.t0, state.reversed);
  }
  // 自由: 既存の点のtを、表示t（起点・向き基準）の昇順で使う
  return state.points.map(function (p) { return p.t; }).sort(function (a, b) {
    return Profile.toDisplayT(a, state.t0, state.reversed) - Profile.toDisplayT(b, state.t0, state.reversed);
  });
}
function applyRuleToPillars() {
  if (!state.segsWorld) return;
  var ts = currentOrderedTs();
  if (!ts.length) return;
  var widths = Profile.applyRule(values.rule, ts, state.t0, state.reversed, { A: values.ruleA, B: values.ruleB, n: values.ruleN });
  state.points = ts.map(function (t, i) { return { t: t, left: widths[i], right: widths[i] }; });
  state.selected = -1;
  updateSelectedRowsVisibility();
  sortPointsKeepSelection();
  pushHistory();
  render();
}
/* --- 奥行きの柱・規則（段3）。柱・起点・規則の仕組みは幅のグラフと共用（profile.js） --- */
function applyRuleToDepthPillars() {
  if (!state.segsWorld) return;
  var ts = currentOrderedTs();
  if (!ts.length) return;
  var zs = Profile.applyRule(values.ruleD, ts, state.t0, state.reversed, { A: values.ruleDA, B: values.ruleDB, n: values.ruleDN });
  state.depthPoints = ts.map(function (t, i) { return { t: t, z: zs[i] }; });
  pushHistory();
  render();
}
// 柱の置き方・本数・起点・向きが変わったら、幅と奥行きの両方の柱を同じt列で作り直す
function regenerateAllPillars() {
  applyRuleToPillars();
  applyRuleToDepthPillars();
}
/* --- 幅・奥行きの点列（規則ベースの柱そのもの）はどちらも常にそのまま返す。「線幅に連動」の
   計算はこれとは別に linkedDepthPctArray/linkedDepthPctAtT が担う（段5・2026-09-25）。 --- */
function effectiveWidthPoints() { return state.points; }
function effectiveDepthPoints() { return state.depthPoints; }

/* --- 段5:「線幅に連動」の計算本体。幅のグラフの曲線（interpAt・現在の補間モード込み）を
   tsArr上で密にサンプルし、その最小→最大を Depth.linkedDepth で −50〜+50% に写す。
   毎フレーム呼ぶ（3D計算・幅のグラフの右軸目盛りの両方で使う）。 ------------------------- */
function widthAvgAtT(sortedWidth, t) {
  var w = interpAt(sortedWidth, t, values.baseWidth, values.interp);
  return (w.left + w.right) / 2;
}
function linkedDepthPctArray(tsArr) {
  var widthPts = effectiveWidthPoints();
  if (!widthPts.length || !tsArr.length) return tsArr.map(function () { return 0; });
  var sortedWidth = widthPts.slice().sort(function (a, b) { return a.t - b.t; });
  var widths = tsArr.map(function (t) { return widthAvgAtT(sortedWidth, t); });
  return Depth.linkedDepth(widths, values.depthInvert);
}
/* 単発の1点だけ知りたいとき（連動OFFへ切り替える瞬間の引き継ぎ用）。
   中心線の密サンプルts（state.outline.ts）上で連動値を計算し、指定tに最も近いサンプルを返す。
   OFF切り替え時に1回だけ呼ぶ想定（renderループでは使わない＝毎フレームには重い）。 */
function linkedDepthPctAtT(t) {
  var out = state.outline;
  if (!out || !out.ts || !out.ts.length) return 0;
  var pcts = linkedDepthPctArray(out.ts);
  var best = 0, bestD = Infinity;
  for (var i = 0; i < out.ts.length; i++) {
    var d = Math.min(Math.abs(out.ts[i] - t), Math.abs(out.ts[i] - t - 1), Math.abs(out.ts[i] - t + 1));
    if (d < bestD) { bestD = d; best = i; }
  }
  return pcts[best];
}
function resetOrientation() {
  values.set('angleX', 0);
  values.set('angleY', 0);
  pushHistory();
  render();
}
function armPickT0() {
  state.pickingT0 = true;
  Studio.toast('起点にする位置をクリック（⇧で任意位置・既定はアンカーへ吸着）');
}
function toggleReversed() {
  state.reversed = !state.reversed;
  pushHistory();
  render();
}
function normalizeSplitLR() {
  if (!values.splitLR) {
    // オフに戻すときは左右の平均へ揃える（分離前の対称状態に戻す）
    state.points.forEach(function (p) { var m = (p.left + p.right) / 2; p.left = m; p.right = m; });
  }
  pushHistory();
  render();
}

/* --- キャンバス操作 -------------------------------------------------------
   クリック: 既存の点に当たれば選択、中心線の近くなら新しい点を追加して選択、
             それ以外（版面外の空白）なら選択解除。
   ドラッグ: 法線方向優先＝幅（左右対称に増減。⌥で片側だけ）。
             接線方向優先＝位置（t を移動）。 --------------------------- */
// インスタONだと絵をfitInto分だけ拡縮しているため、当たり判定はcanvasArtGroup基準で取る
// （無ければcanvas自身＝インスタOFFや未初期化時のフォールバック）。
function svgPointFromEvent(e) {
  var pt = canvas.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  var ctm = (canvasArtGroup || canvas).getScreenCTM().inverse();
  var p = pt.matrixTransform(ctm);
  return [p.x, p.y];
}

canvas.addEventListener('pointerdown', function (e) {
  if (!state.segsWorld) return;

  if (values.rotateMode) {
    startRotateDrag(e);
    return;
  }

  var p = svgPointFromEvent(e);

  if (state.pickingT0) {
    var nearT0 = nearestTToPoint(p);
    var t0New = nearT0.t;
    if (!e.shiftKey) {
      var anchors = Profile.anchorTs(Outline, state.segsWorld, TOL, MAX_LINE_STEP, 0, false);
      var bestA = anchors.length ? anchors[0] : t0New, bestD = Infinity;
      anchors.forEach(function (a) {
        var d = Math.abs(a - t0New); d = Math.min(d, 1 - d);
        if (d < bestD) { bestD = d; bestA = a; }
      });
      t0New = bestA;
    }
    state.t0 = t0New;
    state.pickingT0 = false;
    pushHistory();
    render();
    return;
  }

  var hitEl = e.target.closest('.pt');
  var hitIdx = hitEl ? +hitEl.dataset.idx : -1;

  if (hitIdx >= 0) {
    selectPoint(hitIdx);
    startDrag(e, hitIdx, false);
    return;
  }
  var near = nearestTToPoint(p);
  var HIT_TOL = 24; // 世界座標px（キャンバス範囲680に対する妥当な当たり判定）
  if (near.dist <= HIT_TOL) {
    var wAt = Outline.widthAt(state.points.slice().sort(function (a, b) { return a.t - b.t; }), near.t, values.baseWidth);
    var idx = state.points.length;
    state.points.push({ t: near.t, left: wAt.left, right: wAt.right });
    sortPointsKeepSelection();
    // sortPointsKeepSelection は selected の追跡用。新規点のindexを取り直す。
    idx = state.points.findIndex(function (pt) { return Math.abs(pt.t - near.t) < 1e-9; });

function startDrag(e, idx, isNew) {

  var p0 = state.points[idx];
  var s0 = sampleAt(p0.t);
  var start = svgPointFromEvent(e);
  state.drag = {
    idx: idx, startClient: start, startT: p0.t, startLeft: p0.left, startRight: p0.right,
    normal: s0 ? s0.n : [0, 1], total: state.outline ? state.outline.total : HALF * 6, isNew: isNew
  };
  function move(ev) {
    var cur = svgPointFromEvent(ev);
    var dx = cur[0] - start[0], dy = cur[1] - start[1];
    var d = state.drag;
    var nx = d.normal[0], ny = d.normal[1];
    var tx = -ny, ty = nx; // 接線（法線を90°回す）
    var projN = dx * nx + dy * ny;

    var pt = state.points[d.idx];
    if (!pt) return;
    if (Math.abs(projN) >= Math.abs(projT)) {
      if (ev.altKey) {
        if (projN >= 0) { pt.left = clampWidth(d.startLeft + projN); pt.right = clampWidth(d.startRight); }
        else { pt.right = clampWidth(d.startRight - projN); pt.left = clampWidth(d.startLeft); }
      } else {

        pt.right = clampWidth(d.startRight + projN);

  canvas.addEventListener('pointerup', up);

function clampWidth(v) { return Math.max(0, Math.min(200, v)); }

/* --- 回すモード: キャンバスドラッグで縦・横の角度を変える --------------------- */
function startRotateDrag(e) {

  var start = [e.clientX, e.clientY];

  var SENS = 0.4; // 1pxあたりの角度(°)
  function move(ev) {

/* --- 幅のグラフ: ハンドルを上下ドラッグで幅を変える（イージングカーブエディタと同じ操作感） ---

function graphPointFromEvent(e) {

  var hitEl = e.target.closest('.ghandle');

  try { graph.setPointerCapture(e.pointerId); } catch (e2) { /* 合成イベント等でpointerIdが無効な場合は無視（キャプチャ無しでも動く） */ }
  var maxW = graphMaxW();

    var pt = state.points[idx];

    graph.removeEventListener('pointermove', move);
    graph.removeEventListener('pointerup', up);
    try { graph.releasePointerCapture(ev.pointerId); } catch (e2) { /* 無視 */ }

/* --- 奥行きのグラフ: ハンドルを上下ドラッグでzを変える（幅のグラフと同じ操作感） --- */
function depthGraphPointFromEvent(e) {

/* --- キーボード（006_ツールの規格 §7・KEY-00: キーは Studio.keys に集約する。keydown を
   自前で書かない）。⌘Z/⇧⌘Z は Studio.history をそのまま渡す。X は色の対象（塗り（帯）→塗り層→
   背景の順）を切り替える（上部バーのスウォッチと同じ）。Esc は段階（映像ダイアログ・色の小窓 →

   書き出しの範囲＝版面（frameBox）。includeBg=true（既定）なら背景（colorState.bg）を
   g#art の最初の子として差し込む（§4 OUT-03: 図版はg#artが1個のまま増やさない）。

/* --- 段7-2:「動画にする」 ---------------------------------------------------

   150_動きの書き出しと同じ扱い＝ユーザーが幅・高さを変えても絵は等倍で収める。viewBoxの
   アスペクト比とSVGのpreserveAspectRatio既定(xMidYMid meet)により、指定したwPx/hPxの
   縦横比が違っても絵は伸びず中央にレターボックスで収まる）。

  state.outline = Outline.buildOutline(state.segsWorld, values.baseWidth, state.points, { tol: TOL, maxLineStep: MAX_LINE_STEP, geom: getGeomCached() });
  for (var i = 0; i < N; i++) {

/* --- プレビュー再生（書き出しなし・rAFで角度/深さを動かしてrender()するだけ） --- */

function toggleMotionPreview() {

  if (!state.segsWorld) { Studio.toast('先にSVGを貼ってください', { kind: 'error', sticky: true }); return; }
  motionState.playing = true;
  var t0 = performance.now();
  var savedA = values.angleX, savedB = values.angleY, savedC = values.depthSpanPct;
  motionState.restore = function () { values.set('angleX', savedA); values.set('angleY', savedB); values.set('depthSpanPct', savedC); render(); };
  function frame() {

    var a = motionCurrentAngles(u);

    var u = Motion.frameU(i, count, values.motLoop);

  updateRuleDRowsVisibility();
  updateDepthLinkVisibility();
  state.selected = -1;
  updateSelectedRowsVisibility();
  bar.setMemo(next.memo || '');
  render();
  pushHistory();
  Studio.toast('設定を戻しました（' + (next.date || '日時不明') + '）');
}

/* --- 取り込み: ドロップ／貼り付け ----------------------------------------- */
function handleIncomingText(text) {
  var result = Studio.inspectEnvelope(text);
  if (result.status === 'ok' && result.env.tool === TOOL) { applyRestoredEnv(result.env); return; }
  loadSourceSvg(text);
}
Studio.onDropSVG(stage, function (env, file, result) {
  if (!result) return;
  if (result.status === 'ok' && result.env.tool === TOOL) { applyRestoredEnv(result.env); return; }
  var r = new FileReader();
  r.onload = function () { loadSourceSvg(r.result); };
  r.readAsText(file);
});
document.getElementById('loadPasteBtn').addEventListener('click', function () {
  var text = document.getElementById('svgPaste').value;
  if (!text.trim()) { setError('SVGの文字列が空です'); return; }
  handleIncomingText(text);
});
window.addEventListener('paste', function (e) {
  var tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') return; // 貼り付け欄自身へのペーストは素通し
  var text = (e.clipboardData || window.clipboardData).getData('text');
  if (text && /<svg[\s>]/i.test(text)) {
    e.preventDefault();
    document.getElementById('svgPaste').value = text;
    handleIncomingText(text);
  }
});

/* --- 初期表示: 内蔵サンプル（角丸四角）＋「交互」を適用した柱8本を説明なしで表示 ------- */
document.getElementById('svgPaste').value = SAMPLE_SVG;
loadSourceSvg(SAMPLE_SVG, true, INIT_SCALE);
if (state.segsWorld) {
  regenerateAllPillars(); // 既定: 柱=等間隔8本・幅の規則=交互（3px/20px）。奥行きは既定で「線幅に連動」ON。
  updateDepthLinkVisibility(); // 起動直後にも節の出し分け・奥行きグラフの表示/非表示を確定させる
}
</script>

<script>
/* studio-apps: オフライン用の登録。https か localhost の時だけ動く */
(function(){
  if(!('serviceWorker' in navigator)) return;
  if(!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })
    .then(function(){
      console.info('studio-apps: オフライン準備完了');
      if(navigator.storage && navigator.storage.persist){
        navigator.storage.persist().then(function(ok){ console.info('studio-apps: 永続化 ' + (ok ? '許可' : '未許可')); });
      }
    })
    .catch(function(err){ console.info('studio-apps: オフライン準備に失敗', err); });
})();
</script>
