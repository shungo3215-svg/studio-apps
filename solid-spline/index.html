    m[0] * p[0] + m[1] * p[1] + m[2] * p[2],
    m[3] * p[0] + m[4] * p[1] + m[5] * p[2],

function mat3RotY(deg) {

function pickDefaultColors() {

  function lum(h) { var n = parseInt(String(h).slice(1), 16); return ((n >> 16) & 255) * .299 + ((n >> 8) & 255) * .587 + (n & 255) * .114; }

/* --- 書き出しの版面（§13 VID-01）。大きさ（4:5 等）に合わせて正面の表示と書き出しの範囲を決める。

var frameBox = null;
function setFrame(pxW, pxH, key) {
  var a = pxW / pxH, fw = 2 * HALF, fh = 2 * HALF;
  if (a < 1) fh = fw / a; else if (a > 1) fw = fh * a;
  frameBox = { x: -fw / 2, y: -fh / 2, w: fw, h: fh, pxW: pxW, pxH: pxH, key: key };
  var m = Math.max(fw, fh) * 0.06;

}

  var r = document.createElementNS(SVGNS, 'rect');
  r.setAttribute('x', f.x); r.setAttribute('y', f.y); r.setAttribute('width', f.w); r.setAttribute('height', f.h);
  r.setAttribute('fill', 'none'); r.setAttribute('stroke', '#8A8A8A'); r.setAttribute('stroke-width', 1);
  r.setAttribute('stroke-dasharray', '4 3'); r.setAttribute('vector-effect', 'non-scaling-stroke');
  g.appendChild(r);
  // 横幅の寸法線（版面の上）: 端の目盛り＋「1080 px」
  var y = f.y - Math.max(f.w, f.h) * 0.03, tick = Math.max(f.w, f.h) * 0.012;
  function line(x1, y1, x2, y2) {
    var l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', '#8A8A8A'); l.setAttribute('stroke-width', 1); l.setAttribute('vector-effect', 'non-scaling-stroke');
    g.appendChild(l);
  }
  line(f.x, y, f.x + f.w, y); line(f.x, y - tick, f.x, y + tick); line(f.x + f.w, y - tick, f.x + f.w, y + tick);
  var t = document.createElementNS(SVGNS, 'text');
  t.setAttribute('x', f.x + f.w / 2); t.setAttribute('y', y - tick * 1.3); t.setAttribute('text-anchor', 'middle');
  t.setAttribute('font-size', Math.max(f.w, f.h) * 0.022); t.setAttribute('fill', '#6F6F6F');
  t.setAttribute('font-family', 'ui-monospace, Menlo, monospace'); t.setAttribute('font-weight', '600');

/* --- 段3C・段4是正: 最低限の再生（横・縦の回転速度＋奥行きの揺れ）。回転はplayState.P
   （3x3行列）を毎フレーム画面軸で積む方式（Euler角の折り返しなし・段4是正）。奥行きの揺れは
   表示だけの掛け目にしstate.anchorsは書き換えない（getDisplayAnchorsが再生中だけ
   揺れを掛けたコピーを返す）。 --- */
function getDisplayAnchors(anchorsArr) {
  anchorsArr = anchorsArr || state.anchors;
  if (!playState.active || Math.abs(playState.wobbleFactor - 1) < 1e-9) return anchorsArr;
  var f = playState.wobbleFactor;
  return anchorsArr.map(function (a) { return [a[0], a[1], a[2] * f, a[3]]; });
}

  if (playState.lastT == null) playState.lastT = now;
  var dt = (now - playState.lastT) / 1000;
  playState.lastT = now;
  playState.elapsed += dt;

  // 段4是正: 縦・横とも角度スライダーは動かさず、画面軸の累積回転Pだけを更新する
  // （P = Rx(縦の今フレーム分)·Ry(横の今フレーム分)·P。折り返し無し・連続回転）。
  var dPitch = values.playSpeedX * dt, dYaw = values.playSpeedY * dt;
  if (dPitch !== 0 || dYaw !== 0) {
    var delta = mat3Mul(mat3RotX(dPitch), mat3RotY(dYaw));
    playState.P = mat3Mul(delta, playState.P);
  }

  var a = (values.playWobble || 0) / 100;
  var T = values.playPeriod || 3;
  playState.wobbleFactor = 1 + a * Math.sin(2 * Math.PI * playState.elapsed / T);

}

    // 段3E:「対象=Illustratorのアンカーだけ」。規則をアンカー由来の点にだけ順に当て、
    // 補った点のzはその両隣のアンカーのzをsmoothstepでつなぐ。

  var rotated = applyViewRot(Depth.rotateProject(pts3D, values.angleX, values.angleY));
  var d = '';
  rotated.forEach(function (r, i) { d += (i === 0 ? 'M' : 'L') + r.x.toFixed(2) + ' ' + r.y.toFixed(2); });
  return d + 'Z';
}

/* --- アンカーを置いて描く（INIT-01: 版面（短辺 2*HALF）の60%の直径＝半径 0.3*2*HALF の円周上に8点） -------------------------- */
function placeDefaultCircle() {

}

}

/* --- 選択中のアンカーをパネルへ反映・パネルから反映 --------------------------- */
function applyPanelToSelected(key) {

/* --- 描画パイプライン（段3b改訂）------------------------------------------

   evalClosed(ctrl,64) の一様u点列 → Depth.rotateProject → proj2D と zArr →

   ／g#band（Depth.splitBandPieces(n, zArr, 64) のbyDepth順にpieceD）
   ／g#center（同じ厳密ベジェ・stroke #999 0.5）。
   正面・側面に描く丸は「アンカー」(anchorsNow)そのもの（曲線上の点）。 --------- */
/* --- インスタONで絵を版面に収める（006 §0 版面・Studio.fitInto）。--------------
   「回しても変わらない外接」= 原点からの3D距離の最大（アンカー＋帯の半幅・「載せたもの」・
   奥行きの揺れの最大倍率を含む）を半径とする円。回転（angleX/angleY・再生の累積回転）は
   投影のあとの話なので、この半径には効かない＝回しても拡縮は揺れない。
   AとBが記録済みならその両方の半径の大きい方を使う（A/B再生・映像書き出し中に揺れないため）。

function radiusFromParamsSnapshot(p) {

  var fMax = 1 + Math.max(0, (wobblePct || 0) / 100);
  var R = 0;
  state.loops.forEach(function (loop) { // 全部の輪の最大
    (loop.anchors || []).forEach(function (a) {
      var z = a[2] * fMax;
      var d = Math.sqrt(a[0] * a[0] + a[1] * a[1] + z * z);
      var hw = Math.max((a[3] != null ? a[3] : bw) / 2, bw / 2);

    if (ov.visible === false) return;
    function pv(key, fallback) { var k = 'ov' + idx + '_' + key; return (p && p[k] != null) ? p[k] : fallback; }
    if (ov.mode === 'space') {
      var x = pv('x', ov.x), y = pv('y', ov.y), depth = pv('depth', ov.depth), size = pv('size', ov.size);

}
function artSafeRadius3D() {
  var ab = sb.getAB();
  if (ab.A && ab.B) return Math.max(radiusFromParamsSnapshot(ab.A), radiusFromParamsSnapshot(ab.B));
  return radiusFromParamsSnapshot(null);
}
var cachedFit = null, isDragging = false;
function computeFitTransform() {
  if (document.body.classList.contains('insta-off')) return null;
  if (isDragging && cachedFit) return cachedFit;
  var R = artSafeRadius3D();
  var fb = frameBox || { x: -HALF, y: -HALF, w: 2 * HALF, h: 2 * HALF };
  cachedFit = Studio.fitInto({ x: -R, y: -R, w: 2 * R, h: 2 * R }, { x: fb.x, y: fb.y, w: fb.w, h: fb.h }, 0.08);
  return cachedFit;
}

function computeProjection(loop) { // loop省略＝作業中の輪
  var anchorsNow = getDisplayAnchors(loop ? loop.anchors : state.anchors); // 段3C: 再生中は奥行きの揺れを掛けた表示専用アンカー
  var ctrlNow = deriveCtrl(anchorsNow); // 段3b: Bスプライン制御点は毎回ここで導出（状態に持たない）
  var dense = BSpline.evalClosed(ctrlNow, SPP);
  // 段4是正: まずDepth.rotateProjectで角度スライダーの向きを作り、その結果に
  // playState.P（再生で積んだ画面軸の累積回転）を掛けて最終の(x,y,z)にする。
  var rotated = applyViewRot(Depth.rotateProject(dense.pts3D, values.angleX, values.angleY));
  var proj2D = rotated.map(function (r) { return [r.x, r.y]; });
  var zArr = rotated.map(function (r) { return r.z; });
  var normals = Outline.normalsFor(proj2D);
  var left = [], right = [];
  for (var i = 0; i < proj2D.length; i++) {
    var hw = dense.w[i] / 2;
    left.push([proj2D[i][0] + normals[i][0] * hw, proj2D[i][1] + normals[i][1] * hw]);
    right.push([proj2D[i][0] - normals[i][0] * hw, proj2D[i][1] - normals[i][1] * hw]);
  }
  var ctrlXYZ = ctrlNow.map(function (c) { return [c[0], c[1], c[2]]; });
  var ctrlRotated2D = applyViewRot(Depth.rotateProject(ctrlXYZ, values.angleX, values.angleY)).map(function (r) { return [r.x, r.y]; });
  var centerD = Outline.segsToClosedD(BSpline.toBezierClosed(ctrlRotated2D));
  var anchorsXYZ = anchorsNow.map(function (a) { return [a[0], a[1], a[2]]; });
  var anchorsRotated = applyViewRot(Depth.rotateProject(anchorsXYZ, values.angleX, values.angleY)).map(function (r) { return [r.x, r.y]; });
  return { proj2D: proj2D, z: zArr, left: left, right: right, centerD: centerD, dense: dense, anchorsRotated: anchorsRotated, anchorsNow: anchorsNow };

/* 輪ごとの投影（anchorsが3点以上の輪だけ）。キーは輪のid。 */
function computeAllProjections() {
  var out = {};
  state.loops.forEach(function (loop) { if (loop.anchors && loop.anchors.length >= 3) out[loop.id] = computeProjection(loop); });
  return out;
}
/* 輪のレイヤーid（fill/band/center）の末尾: 1本目（先頭の輪）は今のまま・2本目以降は輪のidを付ける（fill2 / band2 / center2 / band2/<k>） */
function loopIdSuffix(loop) { return state.loops.indexOf(loop) <= 0 ? '' : String(loop.id); }

/* 投影後の帯を小片に分けたSVG片のd文字列（開いた短冊。直線でつなぐ） */
function pieceD(left, right, idxs) {
  function f(p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }
  var d = 'M' + f(left[idxs[0]]);
  for (var i = 1; i < idxs.length; i++) d += 'L' + f(left[idxs[i]]);
  for (var j = idxs.length - 1; j >= 0; j--) d += 'L' + f(right[idxs[j]]);
  return d + 'Z';
}
function round2(v) { return Math.round(v * 100) / 100; }
/* 段4: pieceDと同じ頂点順（left順→right逆順・閉多角形）を動きの書き出しのunits[].pts用に作る。 */
function piecePts(left, right, idxs) {
  var pts = idxs.map(function (i) { return [round2(left[i][0]), round2(left[i][1])]; });
  for (var j = idxs.length - 1; j >= 0; j--) pts.push([round2(right[idxs[j]][0]), round2(right[idxs[j]][1])]);
  return pts;
}

/* --- 段4是正・段8是正: 「載せるもの」の描画（overlay.js の純関数へ、正面2D座標だけを渡す）。
   沿わせる置き方はproj.proj2D/left/right（帯より前を描く既存の投影結果）をそのまま使うので、
   帯がねじれれば絵も一緒に曲がる。空間に置く置き方はvalues.angleX/angleY・playState.P・
   奥行きの揺れ（playState.wobbleFactor）を立体本体と同じ式で掛ける。
   段8: 前後は項目ごとのチェックボックスではなく、レイヤー一覧の並び順（state.layerOrder）で
   決める（buildOrderedLayersが唯一の組み立て口。render()・buildExportSVGの両方がここを通る）。 */
function overlayScaleFactor(ov) {
  var longSide = Math.max(ov.bboxW, ov.bboxH) || 1;
  return ov.mode === 'space' ? (ov.size / longSide) : ((values.baseWidth || 6) * ov.width / longSide);
}
/* 段9: partは subpaths（複数サブパス。穴を含む）を持つ。写像を全サブパスへ同じ式で掛け、
   1つの<path>にM…Z M…Zで連結して書く（穴のサブパスを別要素に分けない＝黒く塗り潰さない）。 */
function buildOverlayGroup(ov, idx, proj, ax, ay, viewP, wobbleF) {
  var gi = document.createElementNS(SVGNS, 'g');
  gi.dataset.ovIdx = String(idx);
  var scaleFactor = overlayScaleFactor(ov);
  var spaceOpts = { x: ov.x, y: ov.y, depth: ov.depth * wobbleF, size: ov.size, rotation: ov.rot, aspectW: ov.bboxW, aspectH: ov.bboxH };
  var lineOpts = { pos: ov.pos, len: ov.len, widthMult: ov.width, offsetPx: ov.offset, flip: ov.flip };
  ov.parts.forEach(function (part) {
    if (part.kind === 'text') {
      var pos = (ov.mode === 'line')
        ? Overlay.mapAlongLine([[part.s, part.t]], proj.proj2D, proj.left, proj.right, lineOpts)[0]
        : Overlay.projectSpaceItem([[part.s, part.t]], spaceOpts, ax, ay, viewP)[0];
      var t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('x', pos[0].toFixed(2)); t.setAttribute('y', pos[1].toFixed(2));
      t.setAttribute('font-size', Math.max(1, (part.fontSize || 16) * scaleFactor));
      t.setAttribute('fill', ov.color == null ? (part.fill || '#000000') : (ov.color === 'none' ? 'none' : ov.color));
      t.textContent = part.text;
      gi.appendChild(t);
      return;
    }
    var d = (part.subpaths || []).map(function (pts, si) {
      var closed = !!(part.closed && part.closed[si]);
      var mapped = (ov.mode === 'line')
        ? Overlay.mapAlongLine(Overlay.densify(pts, 0.005, closed), proj.proj2D, proj.left, proj.right, lineOpts)
        : Overlay.projectSpaceItem(pts, spaceOpts, ax, ay, viewP);
      if (!mapped.length) return '';
      var dd = 'M' + mapped.map(function (pt) { return pt[0].toFixed(2) + ' ' + pt[1].toFixed(2); }).join('L');
      if (closed) dd += 'Z';
      return dd;
    }).filter(function (s) { return s; }).join(' ');
    if (!d) return;
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', d);
    var paint = overlayPartPaint(ov, part);
    p.setAttribute('fill', paint.fill || 'none');
    p.setAttribute('fill-rule', part.fillRule || 'nonzero');
    if (paint.stroke) { p.setAttribute('stroke', paint.stroke); p.setAttribute('stroke-width', Math.max(0.25, (part.strokeWidth || 1) * scaleFactor)); }
    gi.appendChild(p);
  });

}

function buildFillLayer(proj, sfx) {
  var gFill = document.createElementNS(SVGNS, 'g'); gFill.id = 'fill' + (sfx || '');
  var pFill = document.createElementNS(SVGNS, 'path');
  pFill.setAttribute('d', proj.centerD);
  pFill.setAttribute('fill', colorState.fillLayer === 'none' ? 'none' : colorState.fillLayer);
  pFill.setAttribute('fill-rule', 'evenodd');
  gFill.appendChild(pFill);
  return gFill;
}
function buildBandLayers(proj, sfx) {
  var gBand = document.createElementNS(SVGNS, 'g'); gBand.id = 'band' + (sfx || '');
  var fillColor = colorState.fill === 'none' ? 'none' : colorState.fill;
  var n = proj.proj2D.length;
  var split = Depth.splitBandPieces(n, proj.z, PIECE_COUNT);
  split.byDepth.forEach(function (piece) {
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', pieceD(proj.left, proj.right, piece.indices));
    p.setAttribute('fill', fillColor);
    p.setAttribute('fill-rule', 'nonzero');
    gBand.appendChild(p);
  });

  var gCenter = document.createElementNS(SVGNS, 'g'); gCenter.id = 'center' + (sfx || '');
  var pCenter = document.createElementNS(SVGNS, 'path');
  pCenter.setAttribute('class', 'center');
  pCenter.setAttribute('d', proj.centerD);
  gCenter.appendChild(pCenter);

}
/* 段8: レイヤー一覧（state.layerOrder・先頭=前面）の並びどおりにDOMへ積む（後ろから前へ描く）。

function buildOrderedLayers(projs) { // projs: computeAllProjections()の結果（輪のid→投影）

  var ax = values.angleX, ay = values.angleY, viewP = playState.P || mat3Identity();
  var wobbleF = playState.wobbleFactor || 1;
  // 塗り層は旧版と同じく全体の最下層（帯より後ろに置いた「載せるもの」が塗り層に隠れないように）
  for (var f = state.layerOrder.length - 1; f >= 0; f--) {
    var ftok = state.layerOrder[f];
    if (ftok.indexOf('loop:') !== 0) continue;
    var fli = loopIndexById(+ftok.slice(5));
    if (fli < 0 || state.loops[fli].visible === false || !projs[state.loops[fli].id]) continue;
    frag.appendChild(buildFillLayer(projs[state.loops[fli].id], loopIdSuffix(state.loops[fli])));
  }
  for (var i = state.layerOrder.length - 1; i >= 0; i--) {
    var tok = state.layerOrder[i];
    if (tok.indexOf('loop:') === 0) { // 輪: 帯・中心線（塗り層は上で描いた）
      var li = loopIndexById(+tok.slice(5));
      if (li < 0 || state.loops[li].visible === false || !projs[state.loops[li].id]) continue;
      var lp = state.loops[li], lproj = projs[lp.id], sfx = loopIdSuffix(lp);
      var bl = buildBandLayers(lproj, sfx);
      frag.appendChild(bl.bandEl);
      frag.appendChild(bl.centerEl);
      continue;
    }
    var idx = overlayIndexById(+tok);
    if (idx < 0) continue;
    var ov = state.overlays[idx];
    if (ov.visible === false) continue;
    var oproj = projs[ov.loopId];
    if (!oproj && ov.mode !== 'space') continue; // 沿わせる先の輪が描けない時は描かない
    frag.appendChild(buildOverlayGroup(ov, idx, oproj, ax, ay, viewP, wobbleF));
  }
  return frag;
}

function isFrontDraggable() { return !values || (values.angleX === 0 && values.angleY === 0); }

function render() {
  frontCanvas.innerHTML = '';
  sideCanvas.innerHTML = '';
  frontCanvas.classList.toggle('no-drag', !isFrontDraggable());
  // 段5・段6: 背景色（colorState.bg）を正面の表示に反映。「なし」はCSSの既定（var(--surface)）に戻す。
  frontCanvas.style.background = '';
  if (frameBox && colorState.bg && colorState.bg !== 'none') {   // 背景は版面の中だけに塗る（外は作業台の色）
    var fbg = document.createElementNS(SVGNS, 'rect');
    fbg.setAttribute('x', frameBox.x); fbg.setAttribute('y', frameBox.y);
    fbg.setAttribute('width', frameBox.w); fbg.setAttribute('height', frameBox.h);
    fbg.setAttribute('fill', colorState.bg); fbg.setAttribute('pointer-events', 'none');
    frontCanvas.appendChild(fbg);
  }
  drawFrameGuide();
  frontArtGroup = null;
  var projs = computeAllProjections();
  if (!Object.keys(projs).length) return;

  // インスタONの絵を版面に収めるグループ（006 §0 版面）。背景・版面ガイドは外側のまま
  // （拡縮しない）。ポインタのCTM逆変換もこのグループを基準にする（svgPointFromEvent）。
  frontArtGroup = document.createElementNS(SVGNS, 'g');
  frontArtGroup.setAttribute('class', 'fit-art');
  var fit = computeFitTransform();
  if (fit) frontArtGroup.setAttribute('transform', fit.transform);
  frontCanvas.appendChild(frontArtGroup);

  frontArtGroup.appendChild(buildOrderedLayers(projs)); // 段8: 輪ごとの塗り層・帯と「載せるもの」をレイヤー一覧の並び順で描く
  var proj = projs[activeLoopId()]; // アンカーの丸・側面は作業中の輪だけ

  // 元の線（線幅の抑揚から読んだ場合のみ）。g#centerの下（直後）に重ねる。書き出しには入れない。
  if (values.overlaySource && state.sourceOverlaySegs) {
    var overlayD = buildOverlayD();
    if (overlayD) {
      var pOverlay = document.createElementNS(SVGNS, 'path');
      pOverlay.setAttribute('class', 'overlaySrc');
      pOverlay.setAttribute('d', overlayD);
      frontArtGroup.appendChild(pOverlay);
    }
  }

  // 正面: アンカーの丸（線が必ず通る点）。Depth.rotateProject(angleX,angleY)後の(x,y)に描く（回転に追従）。
  var gPtsFront = document.createElementNS(SVGNS, 'g');
  var showAnchors = !values || values.showAnchors !== false;
  if (!proj) { frontArtGroup.appendChild(gPtsFront); return; }
  if (showAnchors) proj.anchorsRotated.forEach(function (p, i) {
    var g = document.createElementNS(SVGNS, 'g');
    var isAnchor = !!(state.isAnchor && state.isAnchor[i]);
    g.setAttribute('class', 'pt' + (isAnchor ? ' anchor' : '') + (i === state.selected ? ' sel' : ''));
    g.dataset.idx = String(i);
    var circle = document.createElementNS(SVGNS, 'circle');
    circle.setAttribute('cx', p[0]); circle.setAttribute('cy', p[1]); circle.setAttribute('r', 6);
    g.appendChild(circle);
    gPtsFront.appendChild(g);
  });
  frontArtGroup.appendChild(gPtsFront);

  // 側面: 中心線（元のx,z。evalClosedの一様u点列をCatmull-Romで結ぶ細い線）＋アンカーの丸。
  // 横軸x・縦軸z（上が手前=+z）。側面は常に元のx,zで描く（正面のような回転追従はしない）。
  // 段3C: 再生中の奥行きの揺れも反映するため、state.anchorsではなくproj.anchorsNow（表示用）を使う。
  var sideCurvePts = proj.dense.pts3D.map(function (p) { return [p[0], -p[2]]; });
  var sideCurveD = Outline.segsToClosedD(Outline.catmullRomClosedSegments(sideCurvePts));
  var pSideCurve = document.createElementNS(SVGNS, 'path');
  pSideCurve.setAttribute('class', 'center');
  pSideCurve.setAttribute('d', sideCurveD);
  sideCanvas.appendChild(pSideCurve);

  var gPtsSide = document.createElementNS(SVGNS, 'g');
  if (showAnchors) proj.anchorsNow.forEach(function (a, i) {
    var g = document.createElementNS(SVGNS, 'g');
    var isAnchor = !!(state.isAnchor && state.isAnchor[i]);
    g.setAttribute('class', 'pt' + (isAnchor ? ' anchor' : '') + (i === state.selected ? ' sel' : ''));
    g.dataset.idx = String(i);
    var circle = document.createElementNS(SVGNS, 'circle');
    circle.setAttribute('cx', a[0]); circle.setAttribute('cy', -a[2]); circle.setAttribute('r', 6);
    g.appendChild(circle);
    gPtsSide.appendChild(g);
  });
  sideCanvas.appendChild(gPtsSide);
}

/* --- キャンバス操作 -------------------------------------------------------
   正面: ドラッグでx,yを動かす。側面: 上下ドラッグでzを動かす。クリックで選択。 --- */
// ctmEl: CTMの逆変換をどの要素基準で取るか（省略時はsvg自身）。正面はインスタONだと絵を
// fitInto分だけ拡縮しているため、frontArtGroup基準で取らないと当たり判定がずれる。
function svgPointFromEvent(svg, e, ctmEl) {
  var pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  var ctm = (ctmEl || svg).getScreenCTM().inverse();
  var p = pt.matrixTransform(ctm);
  return [p.x, p.y];
}

// rAF合流: 高頻度pointermoveでも1フレーム1回だけrender()する（回転ドラッグ用）
var renderScheduled = false;
function scheduleRender() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(function () { renderScheduled = false; render(); });
}

frontCanvas.addEventListener('pointerdown', function (e) {
  var hitEl = e.target.closest('.pt');
  var hitIdx = hitEl ? +hitEl.dataset.idx : -1;
  if (hitIdx < 0) {
    // アンカーの丸以外を押した場合＝回転（線幅の抑揚 startRotateDragと同じ感度）
    selectPoint(-1);
    startRotateDrag(e);
    return;
  }
  selectPoint(hitIdx);
  // 角度が(0,0)以外のときは選択だけ（丸の見た目位置は回転後の投影で、x,yドラッグの
  // 対象である「元のx,y」とは食い違うため、動かせなくする＝カーソルもdefault）。
  if (isFrontDraggable()) startDragFront(e, hitIdx);
});

/* --- 正面キャンバスの空白ドラッグ＝回転（0.4°/px・縦-90..90・横-180..180） --- */
function startRotateDrag(e) {
  try { frontCanvas.setPointerCapture(e.pointerId); } catch (e2) { /* 無視 */ }
  var start = [e.clientX, e.clientY];
  var x0 = values.angleX, y0 = values.angleY;
  var SENS = 0.4; // 1pxあたりの角度(°)
  isDragging = true; // 版面フィットの拡縮はドラッグ中固定（006 §0）
  function move(ev) {
    var dx = ev.clientX - start[0], dy = ev.clientY - start[1];
    values.set('angleX', Math.max(-180, Math.min(180, x0 + dy * SENS)));
    values.set('angleY', Math.max(-180, Math.min(180, y0 + dx * SENS)));
    scheduleRender();
  }
  function up(ev) {
    frontCanvas.removeEventListener('pointermove', move);
    frontCanvas.removeEventListener('pointerup', up);
    try { frontCanvas.releasePointerCapture(ev.pointerId); } catch (e2) { /* 無視 */ }
    isDragging = false;
    render(); // 最終フレームは即描画（拡縮も最新の外接で入れ直す）
    pushHistory();
  }
  frontCanvas.addEventListener('pointermove', move);
  frontCanvas.addEventListener('pointerup', up);
}

function startDragFront(e, idx) {
  try { frontCanvas.setPointerCapture(e.pointerId); } catch (e2) { /* 無視 */ }
  isDragging = true; // 版面フィットの拡縮はドラッグ中固定（掴んだ点が逃げないように・006 §0）
  function move(ev) {
    var p = svgPointFromEvent(frontCanvas, ev, frontArtGroup);
    state.anchors[idx][0] = p[0];
    state.anchors[idx][1] = p[1];
    render();
  }
  function up(ev) {
    frontCanvas.removeEventListener('pointermove', move);
    frontCanvas.removeEventListener('pointerup', up);
    try { frontCanvas.releasePointerCapture(ev.pointerId); } catch (e2) { /* 無視 */ }
    isDragging = false;
    render(); // 最終位置で拡縮を入れ直す
    pushHistory();
  }
  frontCanvas.addEventListener('pointermove', move);
  frontCanvas.addEventListener('pointerup', up);
}

sideCanvas.addEventListener('pointerdown', function (e) {
  var hitEl = e.target.closest('.pt');
  var hitIdx = hitEl ? +hitEl.dataset.idx : -1;
  if (hitIdx < 0) { selectPoint(-1); return; }
  selectPoint(hitIdx);
  startDragSide(e, hitIdx);
});

// 側面ドラッグで隣のアンカーも一緒に動かす（前後spreadN点までsmoothstepで減衰。0なら1点だけ）。
function applySideDragToNeighbors(idx, deltaZ, spreadN) {
  var N = state.anchors.length;
  var k = Math.max(0, Math.round(spreadN || 0));
  if (k <= 0 || Math.abs(deltaZ) < 1e-9) return;
  for (var d = 1; d <= k; d++) {
    var u = 1 - d / (k + 1); // d=1で1に近く、d=kで1/(k+1)（>0）
    var w = Outline.smoothstep(u);
    var li = ((idx - d) % N + N) % N;
    var ri = (idx + d) % N;
    state.anchors[li][2] += deltaZ * w;
    state.anchors[ri][2] += deltaZ * w;
  }
}
function startDragSide(e, idx) {
  try { sideCanvas.setPointerCapture(e.pointerId); } catch (e2) { /* 無視 */ }
  isDragging = true; // 奥行きを変えると正面の版面フィットも動くため、ドラッグ中は固定（006 §0）
  function move(ev) {
    var p = svgPointFromEvent(sideCanvas, ev);
    var newZ = -p[1]; // 上が手前(+z)
    var deltaZ = newZ - state.anchors[idx][2];
    state.anchors[idx][2] = newZ;
    applySideDragToNeighbors(idx, deltaZ, values.depthSpreadN);
    if (state.selected === idx) values.set('ptZ', Math.round(state.anchors[idx][2]));
    render();
  }
  function up(ev) {
    sideCanvas.removeEventListener('pointermove', move);
    sideCanvas.removeEventListener('pointerup', up);
    try { sideCanvas.releasePointerCapture(ev.pointerId); } catch (e2) { /* 無視 */ }
    isDragging = false;
    render();
    pushHistory();
  }
  sideCanvas.addEventListener('pointermove', move);
  sideCanvas.addEventListener('pointerup', up);
}

/* --- 貼り付け欄 ------------------------------------------------------------ */
var svgPasteEl = document.getElementById('svgPaste');
document.getElementById('loadPasteBtn').addEventListener('click', function () {
  loadSourceSvg(svgPasteEl.value);
});
document.getElementById('loadSidePasteBtn').addEventListener('click', function () {
  loadSideSvg(sideSvgPasteEl.value);
});
document.getElementById('removeSideBtn').addEventListener('click', removeSideSvg);
/* 向きを飛ばす: 正面＝縦0°横0°（「SVGを貼る」の形が見える）、横＝縦0°横90°（「横から見た形」が見える）。
   再生で積んだ回転も捨てる（resetAngle と同じ） */
function viewAt(ax, ay) {
  values.set('angleX', ax); values.set('angleY', ay);
  playState.P = mat3Identity();
  render(); pushHistory();
}
document.getElementById('viewFrontBtn').addEventListener('click', function () { viewAt(0, 0); });
document.getElementById('viewSideBtn').addEventListener('click', function () { viewAt(0, 90); });

/* --- 書き出し（006_ツールの規格 §1〜§4） --------------------------------- */
/* 段5・§13 VID-01「背景色を変えられる」／§8 COPY-01「⌘C/SVGをコピーは地色を含めない
   （書き出し・PNGは含める）」。includeBg=trueの時だけ、g#art（§4 OUT-03: 図版はg#artが
   1個）の最初の子として背景矩形を差し込む（g#artを2個に増やさない）。「なし」なら描かない。 */
function buildExportSVG(includeBg) {
  if (includeBg === undefined) includeBg = true;
  var svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('xmlns', SVGNS);
  var fb = frameBox || { x: -HALF, y: -HALF, w: 2 * HALF, h: 2 * HALF };   // 書き出しの範囲＝版面（§13 VID-01）
  svg.setAttribute('viewBox', fb.x + ' ' + fb.y + ' ' + fb.w + ' ' + fb.h);
  svg.setAttribute('width', fb.w); svg.setAttribute('height', fb.h);
  var art = document.createElementNS(SVGNS, 'g'); art.id = 'art';
  if (includeBg && colorState.bg && colorState.bg !== 'none') {
    var bgRect = document.createElementNS(SVGNS, 'rect');
    bgRect.setAttribute('x', fb.x); bgRect.setAttribute('y', fb.y);
    bgRect.setAttribute('width', fb.w); bgRect.setAttribute('height', fb.h);
    bgRect.setAttribute('fill', colorState.bg);
    art.appendChild(bgRect);
  }
  // インスタONの絵を版面に収める（006 §0）。背景は上で既に版面いっぱいのまま足しているので対象外。
  var fitG = document.createElementNS(SVGNS, 'g');
  var fit = computeFitTransform();
  if (fit) fitG.setAttribute('transform', fit.transform);
  fitG.appendChild(buildOrderedLayers(computeAllProjections())); // 段8: 画面と同じ並び順・非表示レイヤーは含めない
  art.appendChild(fitG);
  svg.appendChild(art);
  svg.style.cssText = 'position:fixed;left:-99999px;top:0';
  document.body.appendChild(svg);
  return svg;
}

/* --- 上部バー共通操作（Studio.stageBar・§13 VID-02/03）用の橋渡し ------------------
   getParams/apply: パネルの数値・色の値（values＋colorState）のスナップショット。
   frame: 1コマ分のSVG文字列。A/Bが記録されていればparamsを一時的に当てて
   buildExportSVG(true)を呼び、終わったら元に戻す。A/B無し（params:null）は既存の
   回転再生（再生群の速度・奥行きの揺れ）をt秒時点まで進めた状態を作る（段2指示）。 --- */
function motionParams() {
  var p = {};
  Object.keys(values).forEach(function (k) { p[k] = values[k]; });
  p.fill = colorState.fill; p.fillLayer = colorState.fillLayer; p.bg = colorState.bg;
  // 段5: 「載せるもの」各項目の数値設定（位置・長さ・幅・ずらし・x・y・奥行き・大きさ・回転）を
  // ov{idx}_keyの形で平らにしてA/B・映像の対象へ含める（overlay.js Overlay.flattenOverlayParams）。
  var ovFlat = Overlay.flattenOverlayParams(state.overlays);
  Object.keys(ovFlat).forEach(function (k) { p[k] = ovFlat[k]; });
  return p;
}
function applyParamsToState(p) {
  Object.keys(p).forEach(function (k) {
    if (k === 'fill' || k === 'fillLayer' || k === 'bg') { colorState[k] = p[k]; }
    else if (Object.prototype.hasOwnProperty.call(values, k)) { values.set(k, p[k]); }
  });
  Overlay.applyOverlayParams(p, state.overlays);
  if (state.selectedOverlay >= 0) syncPanelFromSelectedOverlay();
}
// A/B再生（stageBarのrAFループ）から毎フレーム呼ばれる。画面を更新する。
function applyMotionParams(p) { applyParamsToState(p); render(); }

var exportSim = null; // A/B無し書き出し専用の累積回転（frame()は時刻順に呼ばれる前提）
function frameFromOwnMotion(t) {
  if (!exportSim || t <= 1e-9) exportSim = { P: mat3Identity(), lastT: 0 };
  var dt = Math.max(0, t - exportSim.lastT);
  var dPitch = values.playSpeedX * dt, dYaw = values.playSpeedY * dt;
  if (dPitch !== 0 || dYaw !== 0) exportSim.P = mat3Mul(mat3Mul(mat3RotX(dPitch), mat3RotY(dYaw)), exportSim.P);
  exportSim.lastT = t;
  var a = (values.playWobble || 0) / 100, T = values.playPeriod || 3;
  var wobble = 1 + a * Math.sin(2 * Math.PI * t / T);
  var savedP = playState.P, savedActive = playState.active, savedWobble = playState.wobbleFactor;
  playState.P = exportSim.P; playState.active = true; playState.wobbleFactor = wobble;
  var svg = buildExportSVG(true);
  var text = Studio.serializeSVG(svg, { standard: true });
  document.body.removeChild(svg);
  playState.P = savedP; playState.active = savedActive; playState.wobbleFactor = savedWobble;
  return text;
}
function frameForExport(ctx) {
  if (!state.anchors || state.anchors.length < 3) throw new Error('先にアンカーを置いてください');
  if (!ctx.params) return frameFromOwnMotion(ctx.t);
  var beforeValues = {};
  Object.keys(values).forEach(function (k) { beforeValues[k] = values[k]; });
  var beforeColor = { fill: colorState.fill, fillLayer: colorState.fillLayer, bg: colorState.bg };
  applyParamsToState(ctx.params); // render()は呼ばない（書き出し中に画面を毎コマ更新しない）
  var svg = buildExportSVG(true);
  var text = Studio.serializeSVG(svg, { standard: true });
  document.body.removeChild(svg);
  Object.keys(beforeValues).forEach(function (k) { values.set(k, beforeValues[k]); });
  colorState.fill = beforeColor.fill; colorState.fillLayer = beforeColor.fillLayer; colorState.bg = beforeColor.bg;
  return text;
}
function fileBase() { return Studio.fname(TOOL, 'ax' + values.angleX + '_ay' + values.angleY); }
function memoText() { return bar.memoText(); }
function exportMeta() {
  sanitizeLayerOrder();
  var params = {
    loops: state.loops.map(function (l) {
      return {
        id: l.id, anchors: l.anchors, isAnchor: l.isAnchor || l.anchors.map(function () { return false; }),
        sourceSvg: l.sourceText, sourceSvgSide: l.sourceTextSide, ctrlCount: l.ctrlCount, visible: l.visible !== false
      };
    }),
    activeLoop: state.activeLoop,
    angleX: values.angleX, angleY: values.angleY, baseWidth: values.baseWidth,
    viewRot: (playState.P || mat3Identity()).slice(), // 段4是正: 再生で積んだ画面軸回転
    fill: colorState.fill, fillLayer: colorState.fillLayer, bg: colorState.bg,
    overlays: state.overlays, // 段6: 正規化済みの折れ線・色・設定そのもの（旧SVGは無し＝空配列で復元）
    layerOrder: state.layerOrder.slice() // 段8: レイヤーの並び順（先頭=前面）。輪は 'loop:<id>'
  };
  return { tool: TOOL, pj: PJ, law: LAW, seed: null, memo: memoText(), toolVersion: TOOL_VERSION, paramsVersion: PARAMS_VERSION, params: params };
}
function doExportSVG() {
  if (!state.anchors || state.anchors.length < 3) { Studio.toast('先にアンカーを置いてください', { kind: 'error', sticky: true }); return; }
  var svg = buildExportSVG(true); // §13 VID-01: 書き出しは背景込み
  var name = fileBase();
  Studio.exportSVG(svg, { name: name, standard: true, meta: exportMeta() });
  document.body.removeChild(svg);
  Studio.toast(name + '.svg');
}
function doCopySVG() {
  if (!state.anchors || state.anchors.length < 3) { Studio.toast('先にアンカーを置いてください', { kind: 'error', sticky: true }); return; }
  var svg = buildExportSVG(false); // §8 COPY-01: ⌘C/コピーは地色を含めない
  var text = Studio.serializeSVG(svg, { standard: true, meta: exportMeta() });
  document.body.removeChild(svg);
  Studio.copySVG(text).then(function (result) {
    Studio.toast(Studio.copyResultMessage(result));
  }).catch(function (e) {
    Studio.toast(e.message || 'コピーできませんでした', { kind: 'error', sticky: true });
  });
}

/* --- 段4: 動きの書き出し（150_動きの書き出し）へのシーンJSON出口（141_動きと空間への展開/scene-json.md
   §2「scene/1」契約）。DOMに依存しない・computeProjection()の結果から作る（148 三角格子ロゴの
   buildSceneJSON/doExportSceneJSONと同じ書き方。ただしsceneValidateへ直接渡して検査するため
   scene:'1'をここで入れておく＝Studio.sceneExportのfinalizeSceneが上書きしても同じ値）。 --- */
function buildSceneJSON() {
  var projs = computeAllProjections();
  var hasFillLayer = colorState.fillLayer !== 'none';
  sanitizeLayerOrder();

  // 輪ごとに fill/band/center と units を作る。1本目の輪は今のid（fill/band/center/band/<k>）のまま、
  // 2本目以降は輪のidを付ける（fill2/band2/center2/band2/<k>）。後ろの層から前へ並べる。非表示の輪は入れない。
  var shapes = [], units = [];
  for (var oi = state.layerOrder.length - 1; oi >= 0; oi--) {
    var tok = state.layerOrder[oi];
    if (tok.indexOf('loop:') !== 0) continue;
    var li = loopIndexById(+tok.slice(5));
    if (li < 0 || state.loops[li].visible === false || !projs[state.loops[li].id]) continue;
    var loop = state.loops[li], proj = projs[loop.id], sfx = loopIdSuffix(loop);
    var n = proj.proj2D.length;
    var split = Depth.splitBandPieces(n, proj.z, PIECE_COUNT);
    if (hasFillLayer) shapes.push({ id: 'fill' + sfx, layer: 'fill' + sfx, color: colorState.fillLayer, d: proj.centerD });
    var bandDAll = split.byDepth.map(function (piece) { return pieceD(proj.left, proj.right, piece.indices); }).join(' ');
    shapes.push({ id: 'band' + sfx, layer: 'band' + sfx, color: colorState.fill, d: bandDAll });
    shapes.push({ id: 'center' + sfx, layer: 'center' + sfx, color: '#999999', d: proj.centerD });
    if (hasFillLayer) {
      units.push({ id: 'fill' + sfx, layer: 'fill' + sfx, color: colorState.fillLayer, pts: proj.proj2D.map(function (p) { return [round2(p[0]), round2(p[1])]; }), step: 0 });
    }
    var stepBase = hasFillLayer ? 1 : 0;
    split.byDepth.forEach(function (piece, k) {
      units.push({ id: 'band' + sfx + '/' + k, layer: 'band' + sfx, color: colorState.fill, pts: piecePts(proj.left, proj.right, piece.indices), step: stepBase + k });
    });
  }
  var maxStep = -1;
  units.forEach(function (u) { if (u.step > maxStep) maxStep = u.step; });

  var first = state.loops[0] || newLoop(1);
  return {
    scene: '1',
    tool: TOOL, pj: PJ,
    box: [-HALF, -HALF, 2 * HALF, 2 * HALF],
    style: { bg: (colorState.bg && colorState.bg !== 'none') ? colorState.bg : 'none' }, // 段5: 背景色を器へ通す
    shapes: shapes,
    units: units,
    steps: { count: maxStep + 1 },
    rule: {
      type: 'spline3d',
      anchors: first.anchors, isAnchor: first.isAnchor, // 1本目の輪（今までの器の読み方のまま）
      loops: state.loops.map(function (l) { return { id: l.id, anchors: l.anchors, isAnchor: l.isAnchor, ctrlCount: l.ctrlCount }; }),
      angleX: values.angleX, angleY: values.angleY, baseWidth: values.baseWidth,
      placeMode: values.ctrlPlacement,
      viewRot: (playState.P || mat3Identity()).slice(),
      playback: { rotateY: values.playSpeedY, rotateX: values.playSpeedX, swing: values.playWobble, period: values.playPeriod }
    },
    meta: exportMeta()
  };
}
function doExportSceneJSON() {
  if (!state.anchors || state.anchors.length < 3) { Studio.toast('先にアンカーを置いてください', { kind: 'error', sticky: true }); return; }
  var scene = buildSceneJSON();
  var result = Studio.sceneValidate(scene);
  if (!result.ok) { Studio.toast(result.errors[0], { kind: 'error', sticky: true }); return; }
  var name = fileBase();
  Studio.sceneExport(scene, { name: name + '_scene' });
  Studio.toast(name + '_scene.json を書き出しました（動きの書き出しで開けます）');
}
window.buildSceneJSON = buildSceneJSON; // DoD用に公開

/* --- 初期状態: 説明を読まなくても円が置ける（placeDefaultCircleと同じ形） --- */
placeDefaultCircle();
