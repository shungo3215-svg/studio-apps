<script>
"use strict";
/* ==========================================================================
   グリッドパターン — グリッドの各マスに、パターンと並び順を組み合わせて図形を置く。
   006 §0「標準の画面」に準拠（上部バー = Studio.appBar + stageBar／キー = Studio.keys）。
   ========================================================================== */
const $=id=>document.getElementById(id), NSU="http://www.w3.org/2000/svg";
/* 純関数（パターン・並び順・図形の形・ルール評価・状態の検査・プリセット）は core.js。貼った SVG の読み取りは svgparse.js */
const {f,clamp,clone,PATTERN,ORDER,RULES,UNIT,FIT_MARGIN,WORLD,SHAPE_TYPES,MAX_SHAPES,
  makeShape,shapeSVG,customFromShapes,canRound,alwaysLine,typeName,
  buildCells,colorGroups,colorCount,OFF,ON,present,normRule,ruleOf,initState,sanitize,PRESETS,presetShapes,
  GRIDS,gridKind,gridName,sizeable,sizePatternKeys,defaultSizeRule,sizeSteps,layoutGrid,
  addShapeToState,removeShapeFromState,moveShapeInState,
  SYMS,symType,symCaption,randomPick,presetGrid,presetShift,presetSym,makeCandidates,candidateState,
  STEP_OPTS,OPS,AREAS,defaultExtra,cellAt,cellsAlong,bandOf,argShow,argRead,setOverride,clearOverride,clearOverrides,overrideCount,overrideCells,valueOptions,ruleCaption}=GridCore;
const toast=Studio.toast;

/* --- 出自（§1） --- */
const TOOL="grid-pattern", PJ="136_グリッドパターン",
  LAW="グリッドの各マスに、数値パターンと並び順を組み合わせて図形を置く（表示・図形・向き・倍率・色・横のずれ・縦のずれに別々の規則。2本重ねる・範囲で絞る・マスを手で直す）",
  TOOL_VERSION="3.5.0", PARAMS_VERSION=2;

/* S を frame（{x,y,w,h}）の中央に収めて描く。座標は拡縮済みの値で書く（書き出しにtransformを残さない）。
   返り値: shapes = 書き出す図形（g#color1〜g#color4・色の数だけ）／ grid・order・marks = 画面だけの補助（グリッド線・並び順の線・手で直したマスの印）／ geom = 画面の座標とマスの対応 */
function render(S,frame,o){
  o=o||{};
  const C=S.cols;
  const fit=Studio.fitInto(layoutGrid(S,UNIT).box,frame,o.margin==null?FIT_MARGIN:o.margin);   // 全マスの外接（間隔が負のはみ出し・行ずらしも含む）を版面の中央へ
  const u=UNIT*fit.scale, ox=fit.tx, oy=fit.ty;
  const cells=buildCells(S,u,ox,oy);
  const shapes=colorGroups(S,cells);
  let grid="",order="",marks="";
  if(o.aids){
    const L=layoutGrid(S,u);
    if(S.showGrid){
      const d=L.cells.map(c=>"M"+c.poly.map(p=>f(ox+p[0])+" "+f(oy+p[1])).join("L")+"Z").join("");   // 各マスの輪郭（形ごとに正しい線）
      grid=`<path d="${d}" fill="none" stroke="#8C8B87" stroke-opacity=".45" stroke-width="${f(2*fit.scale)}" pointer-events="none"/>`;}
    const sym=symType(S);
    if(sym!=="none"){   // 対称の鏡の線（画面だけ・グリッド線と同じ灰色の破線）。左右 = 縦の中心線・上下 = 横の中心線・4回転 = 両方
      const b=L.box,cx=ox+b.x+b.w/2,cy=oy+b.y+b.h/2,ex=0.03*Math.max(b.w,b.h);
      let d="";
      if(sym!=="tb")d+=`M${f(cx)} ${f(oy+b.y-ex)}L${f(cx)} ${f(oy+b.y+b.h+ex)}`;
      if(sym!=="lr")d+=`M${f(ox+b.x-ex)} ${f(cy)}L${f(ox+b.x+b.w+ex)} ${f(cy)}`;
      grid+=`<path d="${d}" fill="none" stroke="#8C8B87" stroke-opacity=".45" stroke-width="${f(2*fit.scale)}" stroke-dasharray="${f(12*fit.scale)} ${f(8*fit.scale)}" pointer-events="none"/>`;}
    if(o.showOrder){
      const sx=o.showOrder.endsWith(":x"),id=sx?o.showOrder.slice(0,-2):o.showOrder,rule=S.rules[id],ov=sx?(rule&&rule.extra):rule;
      if(rule&&!rule.off&&ov&&!PATTERN[ov.pattern].cell){
        const pts=ORDER[ov.order].f(S.rows,C)
          .map(i=>`${f(ox+L.cells[i].cx)},${f(oy+L.cells[i].cy)}`);   // 各マスの中心を通す
        const h=pts[0].split(",");
        order=`<g id="order" pointer-events="none"><polyline points="${pts.join(" ")}" fill="none" stroke="#D00138"`+
          ` stroke-opacity=".9" stroke-width="${f(10*fit.scale)}" stroke-linejoin="round"/>`+
          `<circle cx="${h[0]}" cy="${h[1]}" r="${f(24*fit.scale)}" fill="#D00138"/></g>`;}}
    const oc=overrideCells(S);
    if(oc.length){   // 手で直したマスの小さな印（画面だけ）
      marks=`<g id="marks" pointer-events="none" fill="#D00138">`+oc.map(([r,c])=>{
        const cl=L.cells[r*C+c],x=Math.min(...cl.poly.map(p=>p[0])),y=Math.min(...cl.poly.map(p=>p[1]));
        return`<circle cx="${f(ox+x+0.14*u)}" cy="${f(oy+y+0.14*u)}" r="${f(0.07*u)}"/>`;}).join("")+`</g>`;}
  }
  return {shapes:shapes,grid:grid,order:order,marks:marks,geom:{u:u,ox:ox,oy:oy}};
}

/* ============ 状態 ============ */
let S=initState(), showOrder=null, currentPreset=-1;
let selIdx=0, menuOpen=false;   // 選択中の図形（S.shapes の番号）／＋図形の見本の格子を開いているか（画面だけの状態）
let cands=null, candOpen=false, candSel=-1, candKeys=null;   // 候補: 8枚 [{S,kind,pinned}]（閉じても残す）／開いているか／選択中の番号／開いている間だけ有効なキー（画面だけの状態）
const candLocks={grid:false,shapes:false,color:true};   // 候補の固定: 形・図形・色（既定は色だけ）
let editMode=false, hfItem="visible", hfVal=1, lastGeom=null;   // 手で直す: ON か／直す項目／入れる値（画面だけの状態）／最後に描いた画面の座標

/* ============ 取り消し（§7 ⌘Z / ⇧⌘Z）。変更のあとの状態を積む ============ */
const hist=Studio.history(100);
let histTimer=null;
function commitNow(){clearTimeout(histTimer);histTimer=null;hist.push(clone(S));}
function commit(){clearTimeout(histTimer);histTimer=setTimeout(commitNow,300);}   // スライダー・数値入力の連続変更用
function applyState(s){if(!s)return;S=clone(s);currentPreset=-1;syncAll();draw();}
function undo(){if(histTimer!==null)commitNow();applyState(hist.undo());}
function redo(){if(histTimer!==null)commitNow();applyState(hist.redo());}

/* ============ 版面（§0・§13 VID-01） ============ */
let frameBox={x:0,y:0,w:WORLD,h:WORLD,pxW:1080,pxH:1080,key:"1:1"};
function setFrame(pxW,pxH,key){
  const a=pxW/pxH;let fw=WORLD,fh=WORLD;
  if(a<1)fh=fw/a;else if(a>1)fw=fh*a;
  frameBox={x:0,y:0,w:fw,h:fh,pxW:pxW,pxH:pxH,key:key};
}
function guideSVG(){
  const fr=frameBox,big=Math.max(fr.w,fr.h),y=fr.y-big*0.03,tick=big*0.012;
  const ln=(x1,y1,x2,y2)=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="#8A8A8A" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  return `<g class="frame-guide" pointer-events="none">`+
    `<rect x="${fr.x}" y="${fr.y}" width="${f(fr.w)}" height="${f(fr.h)}" fill="none" stroke="#8A8A8A" stroke-width="1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`+
    ln(fr.x,y,fr.x+fr.w,y)+ln(fr.x,y-tick,fr.x,y+tick)+ln(fr.x+fr.w,y-tick,fr.x+fr.w,y+tick)+
    `<text x="${f(fr.x+fr.w/2)}" y="${f(y-tick*1.3)}" text-anchor="middle" font-size="${f(big*0.022)}" fill="#6F6F6F" `+
    `font-family="ui-monospace, Menlo, monospace" font-weight="600">${fr.key} · ${fr.pxW} × ${fr.pxH} px</text></g>`;
}
const bgRect=()=>S.bg&&S.bg!=="none"?`<rect x="${frameBox.x}" y="${frameBox.y}" width="${f(frameBox.w)}" height="${f(frameBox.h)}" fill="${S.bg}" pointer-events="none"/>`:"";

/* ============ 描画 ============ */
function draw(){
  const fr=frameBox,m=Math.max(fr.w,fr.h)*0.06;
  const svg=$("drawing");
  svg.setAttribute("viewBox",[fr.x-m,fr.y-m,fr.w+2*m,fr.h+2*m].join(" "));
  const r=render(S,fr,{aids:true,showOrder:showOrder});
  lastGeom=r.geom;
  svg.innerHTML=bgRect()+guideSVG()+r.grid+r.shapes+r.order+r.marks;
  syncBands();
  saveHash();
  if(candOpen)paintCand();   // 候補のシートを開いているあいだは、色・固定の変更に合わせて見本を描き直す
}

/* ============ 書き出し（§1〜§4・§8） ============ */
function buildExportSVG(includeBg){
  const svg=document.createElementNS(NSU,"svg");
  svg.setAttribute("xmlns",NSU);
  svg.setAttribute("viewBox",[frameBox.x,frameBox.y,f(frameBox.w),f(frameBox.h)].join(" "));
  svg.setAttribute("width",f(frameBox.w));svg.setAttribute("height",f(frameBox.h));
  svg.innerHTML=(includeBg?bgRect():"")+render(S,frameBox,{}).shapes;
  return svg;
}
function exportMeta(){
  const m={tool:TOOL,pj:PJ,law:LAW,seed:null,memo:bar.memoText(),   // 乱数は「ランダム」ボタンの結果（規則の引数）を params に保存する。実行時の種は持たない
    toolVersion:TOOL_VERSION,paramsVersion:PARAMS_VERSION,params:clone(S)};
  if(bar.captionOn()){
    const items=["グリッド "+S.cols+"列 × "+S.rows+"行","形 "+gridName(gridKind(S)),"間隔 "+S.gap+"%","図形 "+S.shapes.map(typeName).join("・")];
    if(sizeable(gridKind(S))){
      if(!S.colSize.off)items.push("列の幅 ← "+PATTERN[S.colSize.pattern].n);
      if(!S.rowSize.off)items.push("行の高さ ← "+PATTERN[S.rowSize.pattern].n);}
    items.push(...ruleCaption(S));   // ON のルールごとに「向き ← くり返し／行 ＋足す くり返し／列・円の内側・手で3マス」
    if(symCaption(S))items.push(symCaption(S));   // 「対称 左右」等
    for(let k=1;k<=colorCount(S);k++)items.push(k+"色目 "+S["ink"+k]);
    items.push("背景 "+S.bg);
    m.caption=[items.join(" · ")];
  }
  return m;
}

const SPEC_HTML={

const patOpts=()=>{   // 並び順で数えるパターンと、場所（行・列・中心からの距離）で決まるパターンに分ける

/* 列の幅・行の高さの規則（既存のルール行と同じ見た目。並び順は無い = 列番号・行番号で数える）を「間隔」の下に差し込む */
const gridGrp=document.querySelector("#panel .sk-grp:last-child");
const gRows={};   // 行を出し入れする要素（形によって隠す）
(function(){
  const ch=[...gridGrp.children];   // 0 見出し／1 形／2 列の数／3 行の数／4 間隔／5 ずらし量／6 下向きを反転／7 伸ばす／8 グリッド線
  gRows.shift=ch[5];gRows.flip=ch[6];gRows.stretch=ch[7];
  const keys=sizePatternKeys(),wrap=document.createElement("div");wrap.id="sizeRules";
  const defs=[{key:"colSize",n:"列の幅"},{key:"rowSize",n:"行の高さ"}];
  for(const D of defs){

/* 版面のマスの当たり判定: 画面の座標 → 最後に描いた配置のマス（各マスの輪郭に対する点の内外判定） */
let stroke=null;   // ドラッグ中の状態 {L, erase, p（前回のポインタ位置）, changed}
function eventPoint(e){   // 画面の座標 → グリッドの座標（layoutGrid と同じ原点）
  const svg=$("drawing"),m=svg.getScreenCTM();if(!m||!lastGeom)return null;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(m.inverse());
  return{x:p.x-lastGeom.ox,y:p.y-lastGeom.oy};
}
/* 前回の位置から今回の位置までの線分が通ったマスを、飛ばさずに全部上書きする（cellsAlong はマスの 1/4 以下の間隔で調べる） */
function paintAt(e){
  const p=eventPoint(e);if(!p)return;
  const cells=stroke.p?cellsAlong(stroke.L,stroke.p.x,stroke.p.y,p.x,p.y):[cellAt(stroke.L,p.x,p.y)].filter(Boolean);
  stroke.p=p;
  let any=false;
  for(const cl of cells){
    const changed=stroke.erase?clearOverride(S,hfItem,cl.r,cl.c):setOverride(S,hfItem,cl.r,cl.c,hfVal);
    if(changed)any=true;
  }
  if(any){stroke.changed=true;currentPreset=-1;syncPresets();syncHand();draw();}
}
(function(){
  const svg=$("drawing");
  svg.addEventListener("pointerdown",e=>{
    if(!editMode||candOpen||e.button!==0)return;   // 候補のシートを開いているあいだは手で直さない
    e.preventDefault();
    try{svg.setPointerCapture(e.pointerId);}catch(_){}
    if(histTimer!==null)commitNow();
    stroke={L:layoutGrid(S,lastGeom?lastGeom.u:UNIT),erase:e.altKey,p:null,changed:false};   // ⌥クリック = そのマスの上書きを消す
    paintAt(e);
  });
  svg.addEventListener("pointermove",e=>{if(stroke)paintAt(e);});
  const end=()=>{if(!stroke)return;const ch=stroke.changed;stroke=null;if(ch)commitNow();};   // ドラッグ1回で取り消し1段
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
})();

/* 先頭48マスの値を、段の数で白〜黒の灰色に塗り分けた小さな四角の列。作品の色は使わない */
function bandSVG(b){
  const n=b.values.length,mx=Math.max(1,b.steps-1);
  const rects=b.values.map((v,i)=>{const g=Math.round(255*(1-Math.min(1,Math.max(0,v)/mx)));
    return`<rect x="${i}" y="0" width="1" height="1" fill="rgb(${g},${g},${g})"/>`;}).join("");
  return`<svg viewBox="0 0 ${n} 1" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

/* SVG の文字列（貼り付け・テキスト欄・ファイルのドロップ）を貼った図形として末尾に追加する */
function addCustomFromSVG(text){
  text=String(text||"").trim();
  if(!text){toast("SVGの文字列を貼ってから「追加」を押してください",{kind:"error",sticky:true});return false;}
  if(/^[Mm]\s*[-+.\d]/.test(text)&&/^[\sMmLlHhVvCcSsQqTtAaZz\d.,eE+-]+$/.test(text))
    text='<svg xmlns="http://www.w3.org/2000/svg"><path d="'+text+'"/></svg>';   // パスデータだけも読む
  let ext;
  try{ext=SvgParse.extractShapes(text);}catch(e){toast("SVGを読めませんでした",{kind:"error",sticky:true});return false;}
  const r=customFromShapes(ext.shapes);
  if(r.error){toast(r.error,{kind:"error",sticky:true});return false;}
  const sh=makeShape("custom",{custom:r.custom});
  if(!addShape(sh))return false;
  toast("貼った図形を追加しました");return true;
}

    enter:()=>{const a=document.activeElement;
      if(a&&a.tagName==="BUTTON"){a.click();return;}   // ボタンの上の Enter はボタンの操作
      if(candSel>=0)applyCand(candSel);}
  }});
  paintCand();
  const t=$("candGrid").querySelector('[tabindex="0"]');if(t)t.focus({preventScroll:true});
}
function closeCand(){
  candOpen=false;$("cand").hidden=true;$("candBtn").setAttribute("aria-pressed","false");
  if(candKeys){candKeys.destroy();candKeys=null;}
  if(document.activeElement&&$("cand").contains(document.activeElement))document.activeElement.blur();
}
/* 撒き直す: 残す以外の枚を作り直す。選んでいた枚が作り直されたら選択は外す */
function rerollCand(){
  const prev=cands;
  cands=makeCandidates(Math.random,prev,lastKind);
  if(candSel>=0&&cands[candSel]!==prev[candSel])candSel=-1;
  paintCand();
}
function applyCand(i){
  const e=cands&&cands[i];if(!e)return;
  if(histTimer!==null)commitNow();
  S=candState(e);lastKind=e.kind;selIdx=0;menuOpen=false;currentPreset=-1;showOrder=null;
  closeCand();syncAll();draw();commitNow();
  toast("候補 "+(i+1)+" を版面に入れました");
}
(function(){
  const grid=$("candGrid");
  grid.addEventListener("click",e=>{
    const card=e.target.closest(".cand-card");if(!card)return;
    const i=+card.dataset.i;
    if(e.target.closest(".keep")){cands[i].pinned=!cands[i].pinned;paintCandMarks();return;}
    selectCand(i,true);
  });
  grid.addEventListener("dblclick",e=>{
    const card=e.target.closest(".cand-card");if(!card||e.target.closest(".keep"))return;
    applyCand(+card.dataset.i);
  });
  $("candReroll").onclick=rerollCand;
  $("candClose").onclick=closeCand;
  $("candApply").onclick=()=>{if(candSel>=0)applyCand(candSel);};
  [["lkGrid","grid"],["lkShapes","shapes"],["lkColor","color"]].forEach(([id,k])=>{
    $(id).checked=candLocks[k];
    $(id).onchange=e=>{candLocks[k]=e.target.checked;paintCand();};
  });
})();

/* ============ 状態の保存（URLのハッシュ）と、書き出したSVGからの復元（§1） ============ */
function saveHash(){
  try{history.replaceState(null,"","#"+encodeURIComponent(JSON.stringify(S)));}catch(e){}
}
function loadHash(){
  if(!location.hash||location.hash.length<3)return false;
  try{const s=sanitize(JSON.parse(decodeURIComponent(location.hash.slice(1))));if(!s)return false;S=s;return true;}
  catch(e){return false;}
}
/* paramsVersion 1（図形が番号）も 2 も読む。kit の prepareRestore は版違いを migrate に回す */
const restoreContract={
  tool:TOOL,toolVersion:TOOL_VERSION,paramsVersion:PARAMS_VERSION,
  legacy:{toolVersion:"2.0.0",paramsVersion:1},
  migrate:env=>{
    if(env.paramsVersion!==1&&env.paramsVersion!==2)throw new Error("このツールでは復元できない設定の版です");
    const params=sanitize(env.params);
    if(!params)throw new Error("グリッドの設定が不正です");
    return Object.assign({},env,{params:params,toolVersion:TOOL_VERSION,paramsVersion:PARAMS_VERSION});
  },
  validate:p=>sanitize(p)?true:"グリッドの設定が不正です"
};
Studio.onDropSVG(document.body,(env,file,result)=>{
  if(env&&env.tool===TOOL){
    try{
      const next=Studio.prepareRestore(env,restoreContract);
      if(histTimer!==null)commitNow();
      S=sanitize(next.params);selIdx=0;menuOpen=false;currentPreset=-1;showOrder=null;
      bar.setMemo(next.memo||"");syncAll();draw();commitNow();
      toast("設定を戻しました（"+(env.date||"日時不明")+"）");
    }catch(error){toast(error.message,{kind:"error",sticky:true});}
    return;
  }
  /* このツールの封筒が無い SVG（封筒が無い・他のツールの封筒）は、貼った図形として追加する */
  if(env||(result&&result.status==="missing")){
    file.text().then(addCustomFromSVG).catch(()=>toast("ファイルを読み込めませんでした",{kind:"error",sticky:true}));
    return;
  }
  toast((result&&result.message)||"SVGを読み込めませんでした",{kind:"error",sticky:true});
});

/* ============ キー（§7・KEY-00: Studio.keys に集約。自前の keydown は置かない） ============ */
Studio.keys({
  undo:undo,redo:redo,
  copy:doCopy,
  pasteSVG:addCustomFromSVG,
  outline:()=>$("drawing").classList.toggle("outline"),
  toggleColorTarget:()=>{
    const order=barKeys(),i=order.indexOf(sb.colors.getTarget());   // 見えている色見本だけを回る
    sb.colors.setTarget(order[(i+1)%order.length]);
  },
  extra:{r:()=>candOpen?rerollCand():shuffleAll(),c:()=>candOpen?closeCand():openCand()},   // R: シートが開いているときは撒き直し・閉じているときは版面のランダム／C: 候補のシートを開く・閉じる
  escSteps:[
    sb.closeDialog,
    ()=>{if(!candOpen)return false;closeCand();return true;},
    ()=>{if(!editMode)return false;setEdit(false);return true;},
    ()=>{if(!menuOpen)return false;menuOpen=false;syncShapes();return true;},
    ()=>{if(!showOrder)return false;showOrder=null;syncAll();draw();return true;}
  ]
});

/* ============ 起動 ============ */
/* 群の並び: （ランダム・候補・戻す）→ プリセット → グリッド → 図形 → 選んだ図形 → ルール → 手で直す（何に置くか → 何を置くか → どう変えるか → 手直し） */
(function(){
  gridGrp.dataset.grp="グリッド";
  for(const key of ["","プリセット","グリッド","図形","選んだ図形","ルール","手で直す"]){
    const g=panelEl.querySelector('.sk-grp[data-grp="'+key+'"]');
    if(g)panelEl.appendChild(g);
  }
})();
if(!loadHash())S=initState();
setFrame(1080,1080,"1:1");
syncAll();draw();
hist.push(clone(S));
</script>

<script>
/* studio-apps: オフライン用の登録。https か localhost の時だけ動く */
(function(){
  if(!('serviceWorker' in navigator)) return;
  if(!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })
    .then(function(){
      console.info('studio-apps: オフライン準備完了');
      if(navigator.storage && navigator.storage.persist){
        navigator.storage.persist().then(function(ok){ console.info('studio-apps: 永続化 ' + (ok ? '許可' : '未許可')); });
      }
    })
    .catch(function(err){ console.info('studio-apps: オフライン準備に失敗', err); });
})();
</script>
